name: Release TypeScript

# Pull requests get a dry run for every API. Only an <api>/typescript/v* tag publishes, and only once the
# PUBLISH_TYPESCRIPT repository variable and that API's own variable, such as PUBLISH_ETSY_TYPESCRIPT, are true.
# See docs/architecture.md.
on:
  pull_request:
    paths:
      - .github/actions/release-target/**
      - .github/actions/upstream-spec/**
      - .github/workflows/release-typescript.yml
      - apis/*/packages/typescript/CHANGELOG.md
      - apis/*/packages/typescript/package.json
  push:
    tags: ["*/typescript/v*", "typescript/v*"]

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.target.outputs.matrix }}
      api: ${{ steps.target.outputs.api }}
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
      gate: ${{ steps.target.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: target
        uses: ./.github/actions/release-target
        with:
          language: typescript

  build:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.target.outputs.matrix) }}
    env:
      SCARF_ANALYTICS: "false"
      API: ${{ matrix.api }}
      PACKAGE: ${{ matrix.package }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version and changelog, is on main, and the package is not private
        if: github.event_name == 'push'
        working-directory: apis/${{ matrix.api }}/packages/typescript
        env:
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "Boolean(require('./package.json').private)")" = false
          grep -F "## $VERSION " CHANGELOG.md | grep -Fv unreleased
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apis/${{ matrix.api }}/packages/typescript/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/upstream-spec
        with:
          api: ${{ matrix.api }}
          save: true
      - run: npm run spec:build
      - run: npm ci --ignore-scripts
        working-directory: apis/${{ matrix.api }}/packages/typescript
      - name: Generated code matches the spec, templates and runtime
        run: |
          npm run generate:typescript
          git add -N "apis/$API/packages/typescript"
          git diff --exit-code "apis/$API/packages/typescript"
      - working-directory: apis/${{ matrix.api }}/packages/typescript
        run: |
          npm run build
          npm test
      - run: npm run conformance:typescript
      - run: npm run conformance:typescript:cjs
      - name: Pack, and check the licence and notice ship
        working-directory: apis/${{ matrix.api }}/packages/typescript
        run: |
          npm pack
          tar tzf "$PACKAGE"-*.tgz | grep -E '^package/LICENSE$'
          tar tzf "$PACKAGE"-*.tgz | grep -E '^package/NOTICE$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-tarball-${{ matrix.api }}
          path: apis/${{ matrix.api }}/packages/typescript/${{ matrix.package }}-*.tgz
          if-no-files-found: error

  # Back Market published before each API had its own variable, so it needs only PUBLISH_TYPESCRIPT.
  publish:
    needs: [target, build]
    if: >-
      github.event_name == 'push' && vars.PUBLISH_TYPESCRIPT == 'true' &&
      (needs.target.outputs.api == 'backmarket' || vars[needs.target.outputs.gate] == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.target.outputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-tarball-${{ needs.target.outputs.api }}
      - name: Publish, unless this version is already on npm
        env:
          PACKAGE: ${{ needs.target.outputs.package }}
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          if [ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$PACKAGE@$VERSION is already published."
          else
            npm publish ./"$PACKAGE"-*.tgz --access public --provenance --tag alpha
          fi

  # Installs what was just published from the registry, as a user would, and makes one call against the mock.
  published:
    needs: [target, publish]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/published.yml
    with:
      api: ${{ needs.target.outputs.api }}
      language: typescript
      version: ${{ needs.target.outputs.version }}
