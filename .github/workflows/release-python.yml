name: Release Python

# Pull requests get a dry run. Only a python/v* tag publishes, and only once the
# PUBLISH_PYTHON repository variable is true. See docs/architecture.md.
on:
  pull_request:
    paths:
      - .github/actions/upstream-spec/**
      - .github/workflows/release-python.yml
      - apis/backmarket/packages/python/CHANGELOG.md
      - apis/backmarket/packages/python/src/backmarket_seller/__init__.py
  push:
    tags: ["python/v*"]

permissions:
  contents: read

# TODO: Release another API's package with a copy of this workflow that sets API to its directory under apis/ and
# uses its own tag prefix, paths and registry environment. Publishing it waits for the owner's approval.
env:
  API: backmarket

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCARF_ANALYTICS: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version and changelog, and is on main
        if: github.event_name == 'push'
        working-directory: apis/backmarket/packages/python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#python/v}"
          grep -Fx "__version__ = \"$version\"" src/backmarket_seller/__init__.py
          grep -F "## $version " CHANGELOG.md | grep -Fv unreleased
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/upstream-spec
        with:
          api: ${{ env.API }}
          save: true
      - run: npm run spec:build
      - run: python -m pip install -e 'apis/backmarket/packages/python[dev]'
      - name: Generated code matches the spec, templates and runtime
        run: |
          npm run generate:python
          git add -N apis/backmarket/packages/python
          git diff --exit-code apis/backmarket/packages/python
      - working-directory: apis/backmarket/packages/python
        run: python -m pytest
      - run: npm run conformance:python
      - run: npm run conformance:python:async
      - name: Build, and check the licence and notice ship
        working-directory: apis/backmarket/packages/python
        run: |
          python -m build
          unzip -l dist/*.whl | grep -E 'licenses/LICENSE$'
          unzip -l dist/*.whl | grep -E 'licenses/NOTICE$'
          tar tzf dist/*.tar.gz | grep -E '/LICENSE$'
          tar tzf dist/*.tar.gz | grep -E '/NOTICE$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: apis/backmarket/packages/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_PYTHON == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/backmarket-seller/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
