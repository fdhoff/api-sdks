name: Release Rust

# Pull requests get a dry run. Only a rust/v* tag publishes, and only once the
# PUBLISH_RUST repository variable is true. See docs/architecture.md.
on:
  pull_request:
    paths:
      - .github/actions/upstream-spec/**
      - .github/workflows/release-rust.yml
      - apis/backmarket/packages/rust/CHANGELOG.md
      - apis/backmarket/packages/rust/Cargo.toml
  push:
    tags: ["rust/v*"]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.99"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCARF_ANALYTICS: "false"
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version and changelog, is on main, and the crate is publishable
        if: github.event_name == 'push'
        working-directory: apis/backmarket/packages/rust
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#rust/v}"
          grep -Fx "version = \"$version\"" Cargo.toml
          ! grep -Fx "publish = false" Cargo.toml
          grep -F "## $version " CHANGELOG.md | grep -Fv unreleased
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/upstream-spec
        with:
          save: true
      - run: npm run spec:build
      - name: Generated code matches the spec, templates and runtime
        run: |
          npm run generate:rust
          git add -N apis/backmarket/packages/rust
          git diff --exit-code apis/backmarket/packages/rust
      - working-directory: apis/backmarket/packages/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - run: npm run conformance:rust
      - name: Package, and check the licence and notice ship
        working-directory: apis/backmarket/packages/rust
        run: |
          cargo package --locked --allow-dirty
          cargo package --list --locked --allow-dirty | grep -x LICENSE
          cargo package --list --locked --allow-dirty | grep -x NOTICE

  # cargo publish builds from source, so this job checks out the tagged commit
  # instead of reusing an artifact. The generated code is committed, so it needs
  # no spec.
  publish:
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_RUST == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/backmarket-seller
    permissions:
      id-token: write
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this version is already on crates.io
        id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#rust/v}"
          if curl -fsS https://index.crates.io/ba/ck/backmarket-seller | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
            echo "backmarket-seller $version is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - id: auth
        if: steps.published.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.published.outputs.skip != 'true'
        working-directory: apis/backmarket/packages/rust
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
