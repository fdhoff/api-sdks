name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SCARF_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apis/backmarket/spec/upstream/openapi.yaml
          key: upstream-spec-${{ hashFiles('apis/backmarket/spec/upstream/lock.json') }}
      - run: npm run spec:fetch
      - run: npm run spec:build
      - run: npm run spec:lint
      - run: npm test
