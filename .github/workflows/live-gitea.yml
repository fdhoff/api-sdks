name: Gitea live

# Runs the live scenarios in apis/gitea/conformance/live against a disposable Gitea container at the pinned release.
# The admin, user and token are synthetic and made per run inside the container, and no repository secret is used,
# so this is safe on pull requests from forks. It never calls gitea.com or any other instance.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * 1"
  push:
    branches: [main]
    paths:
      - .github/workflows/live-gitea.yml
      - apis/gitea/**
      - toolchain/conformance/**
      - toolchain/runtime/**
  pull_request:
    paths:
      - .github/workflows/live-gitea.yml
      - apis/gitea/**
      - toolchain/conformance/**
      - toolchain/runtime/**

permissions:
  contents: read

concurrency:
  group: live-gitea-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: npm ci --ignore-scripts
      - run: echo "SETTINGS=$RUNNER_TEMP/gitea-live.json" >> "$GITHUB_ENV"
      - run: python -m pip install ./apis/gitea/packages/python
      - name: Start Gitea and make synthetic users and a token
        run: apis/gitea/conformance/live/bootstrap.sh "$SETTINGS"
      - name: Live scenarios, sync client
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "python apis/gitea/packages/python/live/live_driver.py --mode sync"
      - name: Live scenarios, async client
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "python apis/gitea/packages/python/live/live_driver.py --mode async"
      - name: Gitea log
        if: failure()
        run: docker logs gitea-live 2>&1 | tail -n 200
      - if: always()
        run: |
          docker rm --force gitea-live > /dev/null 2>&1 || true
          rm -f "$SETTINGS"

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - run: npm ci --ignore-scripts
      - run: echo "SETTINGS=$RUNNER_TEMP/gitea-live.json" >> "$GITHUB_ENV"
      - run: go -C apis/gitea/packages/go build -o bin/driver ./conformance/driver
      - name: Start Gitea and make synthetic users and a token
        run: apis/gitea/conformance/live/bootstrap.sh "$SETTINGS"
      - name: Live scenarios
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "apis/gitea/packages/go/bin/driver -live"
      - name: Gitea log
        if: failure()
        run: docker logs gitea-live 2>&1 | tail -n 200
      - if: always()
        run: |
          docker rm --force gitea-live > /dev/null 2>&1 || true
          rm -f "$SETTINGS"

  csharp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DRIVER: apis/gitea/packages/csharp/conformance/bin/live
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci --ignore-scripts
      - run: echo "SETTINGS=$RUNNER_TEMP/gitea-live.json" >> "$GITHUB_ENV"
      - run: dotnet build apis/gitea/packages/csharp/conformance/Driver -c Release -f net10.0 -o "$DRIVER"
      - name: Start Gitea and make synthetic users and a token
        run: apis/gitea/conformance/live/bootstrap.sh "$SETTINGS"
      - name: Live scenarios
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "dotnet $DRIVER/GiteaRest.Conformance.dll --live"
      - name: Gitea log
        if: failure()
        run: docker logs gitea-live 2>&1 | tail -n 200
      - if: always()
        run: |
          docker rm --force gitea-live > /dev/null 2>&1 || true
          rm -f "$SETTINGS"

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PACKAGE: apis/gitea/packages/typescript
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apis/gitea/packages/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: echo "SETTINGS=$RUNNER_TEMP/gitea-live.json" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts && npm run build
        working-directory: ${{ env.PACKAGE }}
      - name: Start Gitea and make synthetic users and a token
        run: apis/gitea/conformance/live/bootstrap.sh "$SETTINGS"
      - name: Live scenarios, ESM
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "node $PACKAGE/conformance/driver.mjs --format esm --live"
      - name: Live scenarios, CommonJS
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "node $PACKAGE/conformance/driver.mjs --format cjs --live"
      - name: Gitea log
        if: failure()
        run: docker logs gitea-live 2>&1 | tail -n 200
      - if: always()
        run: |
          docker rm --force gitea-live > /dev/null 2>&1 || true
          rm -f "$SETTINGS"

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: "1.85"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: npm ci --ignore-scripts
      - run: echo "SETTINGS=$RUNNER_TEMP/gitea-live.json" >> "$GITHUB_ENV"
      - run: cargo build --locked --manifest-path apis/gitea/packages/rust/Cargo.toml --example conformance-driver
      - name: Start Gitea and make synthetic users and a token
        run: apis/gitea/conformance/live/bootstrap.sh "$SETTINGS"
      - name: Live scenarios
        run: node apis/gitea/conformance/live/run.mjs --settings "$SETTINGS" --driver "apis/gitea/packages/rust/target/debug/examples/conformance-driver --live"
      - name: Gitea log
        if: failure()
        run: docker logs gitea-live 2>&1 | tail -n 200
      - if: always()
        run: |
          docker rm --force gitea-live > /dev/null 2>&1 || true
          rm -f "$SETTINGS"
