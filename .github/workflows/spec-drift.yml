name: Spec drift

# Opens or updates one pull request when the upstream spec changes. See docs/architecture.md.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-drift
  cancel-in-progress: false

env:
  BRANCH: spec-drift
  SPEC: apis/backmarket/spec/upstream/openapi.yaml
  LOCK: apis/backmarket/spec/upstream/lock.json

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCARF_ANALYTICS: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the open drift pull request
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SPEC }}
          key: upstream-spec-${{ hashFiles('apis/backmarket/spec/upstream/lock.json') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apis/backmarket/packages/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Compare upstream with the pin
        id: pin
        env:
          OPEN_PR: ${{ steps.open.outputs.pr }}
        run: |
          if [ -f "$SPEC" ]; then cp "$SPEC" "$RUNNER_TEMP/pinned.yaml"; fi
          pinned=$(jq -r .sha256 "$LOCK")
          npm run spec:pin
          upstream=$(jq -r .sha256 "$LOCK")
          proposed=
          if [ -n "$OPEN_PR" ]; then
            proposed=$(git show "origin/$BRANCH:$LOCK" 2>/dev/null | jq -r .sha256 || true)
          fi
          if [ "$upstream" = "$pinned" ]; then
            echo "Upstream matches the pin."
          elif [ "$upstream" = "$proposed" ]; then
            echo "Pull request #$OPEN_PR already proposes $upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the new spec
        id: build
        if: steps.pin.outputs.changed
        continue-on-error: true
        run: npm run spec:build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.build.outcome == 'success'
        with:
          python-version: "3.14"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.build.outcome == 'success'
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.build.outcome == 'success'
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.build.outcome == 'success'
        with:
          dotnet-version: 10.0.x
      - name: Install rustfmt
        if: steps.build.outcome == 'success'
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt && rustup default 1.99
      - name: Regenerate clients
        if: steps.build.outcome == 'success'
        run: |
          python -m pip install -e 'apis/backmarket/packages/python[dev]'
          (cd apis/backmarket/packages/typescript && npm ci --ignore-scripts)
          npm run generate:python
          npm run generate:typescript
          npm run generate:go
          npm run generate:csharp
          npm run generate:rust
      - name: Open or update the pull request
        if: ${{ !cancelled() && steps.pin.outputs.changed }}
        env:
          # A pull request opened with the default token does not trigger CI.
          GH_TOKEN: ${{ secrets.SPEC_DRIFT_TOKEN || github.token }}
          BUILD: ${{ steps.build.outcome }}
          JOB: ${{ job.status }}
          OPEN_PR: ${{ steps.open.outputs.pr }}
          HAS_TOKEN: ${{ secrets.SPEC_DRIFT_TOKEN != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          upstream=$(jq -r .sha256 "$LOCK")
          {
            echo "The upstream spec changed. This moves the pin to \`$upstream\` and regenerates the clients."
            echo
            if [ "$BUILD" != success ]; then
              echo "**The overlay no longer applies, so the clients were not regenerated.** Fix \`apis/backmarket/spec/overlay.yaml\` on this branch, then regenerate. Details are in the [drift run]($RUN_URL)."
              echo
            elif [ "$JOB" != success ]; then
              echo "**Regenerating the clients failed, so this pull request moves only the pin.** Fix the generator or templates on this branch, then regenerate. Details are in the [drift run]($RUN_URL)."
              echo
            fi
            if [ "$HAS_TOKEN" != true ]; then
              echo "CI does not run on pull requests opened with the default workflow token. Close and reopen this one to start it, or set the \`SPEC_DRIFT_TOKEN\` secret."
              echo
            fi
            echo "## What changed upstream"
            echo
            node toolchain/pipeline/spec-diff.mjs "$RUNNER_TEMP/pinned.yaml" "$SPEC"
            echo
            echo "Check every changed operation and schema against \`apis/backmarket/docs/spec-audit.md\`, and add a changelog entry to each package whose public API changed."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$JOB" != success ]; then
            git checkout HEAD -- apis/backmarket/packages
            git clean -fdq apis/backmarket/packages
          fi
          git checkout -B "$BRANCH"
          git add "$LOCK" apis/backmarket/packages
          git commit --quiet -m "Update upstream spec pin to ${upstream:0:12}"
          gh auth setup-git
          git push --force origin "$BRANCH"
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main --title "ADHOC-0: [spec] Update upstream spec pin" --body-file "$RUNNER_TEMP/body.md"
          fi
