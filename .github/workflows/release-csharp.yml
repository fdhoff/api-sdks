name: Release C#

# Pull requests get a dry run. Only a csharp/v* tag publishes, and only once the
# PUBLISH_CSHARP repository variable is true. See docs/architecture.md.
on:
  pull_request:
    paths:
      - .github/actions/upstream-spec/**
      - .github/workflows/release-csharp.yml
      - apis/backmarket/packages/csharp/CHANGELOG.md
      - apis/backmarket/packages/csharp/src/BackMarketSeller/BackMarketSeller.csproj
  push:
    tags: ["csharp/v*"]

permissions:
  contents: read

# TODO: Release another API's package with a copy of this workflow that sets API to its directory under apis/ and
# uses its own tag prefix, paths and registry environment. Publishing it waits for the owner's approval.
env:
  API: backmarket

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCARF_ANALYTICS: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version and changelog, and is on main
        if: github.event_name == 'push'
        working-directory: apis/backmarket/packages/csharp
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#csharp/v}"
          grep -F "<Version>$version</Version>" src/BackMarketSeller/BackMarketSeller.csproj
          grep -F "## $version " CHANGELOG.md | grep -Fv unreleased
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/upstream-spec
        with:
          api: ${{ env.API }}
          save: true
      - run: npm run spec:build
      - name: Generated code matches the spec, templates and runtime
        run: |
          npm run generate:csharp
          git add -N apis/backmarket/packages/csharp
          git diff --exit-code apis/backmarket/packages/csharp
      - working-directory: apis/backmarket/packages/csharp
        run: |
          dotnet format BackMarketSeller.slnx --verify-no-changes
          dotnet build BackMarketSeller.slnx -c Release
          dotnet test --solution BackMarketSeller.slnx -c Release --no-build
      - run: npm run conformance:csharp
      - run: npm run conformance:csharp:net8
      - name: Pack, and check the licence and notice ship
        working-directory: apis/backmarket/packages/csharp
        run: |
          dotnet pack src/BackMarketSeller -c Release -o dist
          unzip -l dist/*.nupkg | grep -E ' LICENSE$'
          unzip -l dist/*.nupkg | grep -E ' NOTICE$'
          unzip -p dist/*.nupkg BackMarketSeller.nuspec | grep -F '<license type="expression">Apache-2.0</license>'
          unzip -l dist/*.nupkg | grep -E ' icon.png$'
          unzip -l dist/*.nupkg | grep -E ' lib/net8.0/BackMarketSeller.dll$'
          unzip -l dist/*.nupkg | grep -E ' lib/net10.0/BackMarketSeller.dll$'
          unzip -p dist/*.nupkg BackMarketSeller.nuspec | grep -F "commit=\"$GITHUB_SHA\""
          unzip -l dist/*.snupkg | grep -E ' lib/net8.0/BackMarketSeller.pdb$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-nupkg
          path: |
            apis/backmarket/packages/csharp/dist/*.nupkg
            apis/backmarket/packages/csharp/dist/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_CSHARP == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/BackMarketSeller
    permissions:
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csharp-nupkg
          path: dist/
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: fdhoff
      - run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
