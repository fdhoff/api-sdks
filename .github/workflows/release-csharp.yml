name: Release C#

# Pull requests get a dry run for every API. Only an <api>/csharp/v* tag publishes, and only once the PUBLISH_CSHARP
# repository variable and that API's own variable, such as PUBLISH_ETSY_CSHARP, are true. See docs/architecture.md.
on:
  pull_request:
    paths:
      - .github/actions/release-target/**
      - .github/actions/upstream-spec/**
      - .github/workflows/release-csharp.yml
      - apis/*/packages/csharp/CHANGELOG.md
      - apis/*/packages/csharp/src/*/*.csproj
  push:
    tags: ["*/csharp/v*", "csharp/v*"]

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.target.outputs.matrix }}
      api: ${{ steps.target.outputs.api }}
      package: ${{ steps.target.outputs.package }}
      version: ${{ steps.target.outputs.version }}
      gate: ${{ steps.target.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: target
        uses: ./.github/actions/release-target
        with:
          language: csharp

  build:
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.target.outputs.matrix) }}
    env:
      SCARF_ANALYTICS: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      API: ${{ matrix.api }}
      PACKAGE: ${{ matrix.package }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the package version and changelog, and is on main
        if: github.event_name == 'push'
        working-directory: apis/${{ matrix.api }}/packages/csharp
        env:
          VERSION: ${{ needs.target.outputs.version }}
        run: |
          grep -F "<Version>$VERSION</Version>" "src/$PACKAGE/$PACKAGE.csproj"
          grep -F "## $VERSION " CHANGELOG.md | grep -Fv unreleased
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/upstream-spec
        with:
          api: ${{ matrix.api }}
          save: true
      - run: npm run spec:build
      - name: Generated code matches the spec, templates and runtime
        run: |
          npm run generate:csharp
          git add -N "apis/$API/packages/csharp"
          git diff --exit-code "apis/$API/packages/csharp"
      - working-directory: apis/${{ matrix.api }}/packages/csharp
        run: |
          dotnet format "$PACKAGE.slnx" --verify-no-changes
          dotnet build "$PACKAGE.slnx" -c Release
          dotnet test --solution "$PACKAGE.slnx" -c Release --no-build
      - run: npm run conformance:csharp
      - run: npm run conformance:csharp:net8
      - name: Pack, and check the licence and notice ship
        working-directory: apis/${{ matrix.api }}/packages/csharp
        run: |
          dotnet pack "src/$PACKAGE" -c Release -o dist
          unzip -l dist/*.nupkg | grep -E ' LICENSE$'
          unzip -l dist/*.nupkg | grep -E ' NOTICE$'
          unzip -p dist/*.nupkg "$PACKAGE.nuspec" | grep -F '<license type="expression">Apache-2.0</license>'
          unzip -l dist/*.nupkg | grep -E ' icon.png$'
          unzip -l dist/*.nupkg | grep -E " lib/net8.0/$PACKAGE.dll$"
          unzip -l dist/*.nupkg | grep -E " lib/net10.0/$PACKAGE.dll$"
          unzip -p dist/*.nupkg "$PACKAGE.nuspec" | grep -F "commit=\"$GITHUB_SHA\""
          unzip -l dist/*.snupkg | grep -E " lib/net8.0/$PACKAGE.pdb$"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-nupkg-${{ matrix.api }}
          path: |
            apis/${{ matrix.api }}/packages/csharp/dist/*.nupkg
            apis/${{ matrix.api }}/packages/csharp/dist/*.snupkg
          if-no-files-found: error

  # Back Market published before each API had its own variable, so it needs only PUBLISH_CSHARP.
  publish:
    needs: [target, build]
    if: >-
      github.event_name == 'push' && vars.PUBLISH_CSHARP == 'true' &&
      (needs.target.outputs.api == 'backmarket' || vars[needs.target.outputs.gate] == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/${{ needs.target.outputs.package }}
    permissions:
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csharp-nupkg-${{ needs.target.outputs.api }}
          path: dist/
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: fdhoff
      - run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  # Installs what was just published from the registry, as a user would, and makes one call against the mock.
  published:
    needs: [target, publish]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/published.yml
    with:
      api: ${{ needs.target.outputs.api }}
      language: csharp
      version: ${{ needs.target.outputs.version }}
