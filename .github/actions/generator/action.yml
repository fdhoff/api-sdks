name: Pinned OpenAPI Generator
description: >-
  Restores the pinned OpenAPI Generator jar from the Actions cache, keyed by the SHA-256 in
  toolchain/generator/lock.json. Downloads it only on a miss, with retries, and checks it against the lock.
  See docs/architecture.md.
inputs:
  save:
    description: >-
      Save the jar to the cache after a miss. Set it in one job per workflow, so parallel jobs do not race to save
      the same key.
    default: "false"
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: node toolchain/pipeline/generator.mjs --cache >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
    - shell: bash
      run: node toolchain/pipeline/generator.mjs
    - if: inputs.save == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
