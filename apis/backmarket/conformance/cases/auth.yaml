cases:
  - name: auth-sends-token-verbatim
    request:
      operation: get-ws-specific-order
      params: { order_id: 1 }
    mock:
      prism: {}
    wire:
      - method: GET
        path: /ws/orders/1
        headers:
          authorization: Basic {{token}}
          user-agent: BM-Example-Conformance;conformance@example.com
          accept: application/json
    expect:
      result_keys: [order_id]

  - name: auth-does-not-encode-the-token
    client:
      token: synthetic:token==
    request:
      operation: get-ws-specific-order
      params: { order_id: 1 }
    mock:
      prism: {}
    wire:
      - method: GET
        path: /ws/orders/1
        headers:
          authorization: Basic synthetic:token==
    expect:
      result_keys: [order_id]

  - name: auth-covers-operations-upstream-left-open
    request:
      operation: GetBackboxData
    mock:
      prism: {}
    wire:
      - method: GET
        path: /ws/listings_bi
        headers:
          authorization: Basic {{token}}
    expect:
      result_keys: [results]

  - name: headers-send-locale-on-declared-operation
    client:
      locale: fr-fr
    request:
      operation: get-bm-catalog-category
    mock:
      prism: {}
    wire:
      - method: GET
        path: /ws/category/tree
        headers:
          accept-language: fr-fr
    expect:
      result_keys: [category_id]

  - name: headers-send-locale-on-every-operation
    request:
      operation: get-ws-specific-order
      params: { order_id: 1 }
    mock:
      prism: {}
    wire:
      - method: GET
        path: /ws/orders/1
        headers:
          accept-language: en-us
    expect:
      result_keys: [order_id]

  - name: headers-json-content-type-on-json-bodies
    request:
      operation: post-ws-create-or-update-listings
      body:
        catalog: "sku;quantity\nEXAMPLE-SKU;1"
        quotechar: '"'
        delimiter: ';'
        encoding: latin1
    mock:
      prism: {}
    wire:
      - method: POST
        path: /ws/listings
        headers_match:
          content-type: ^application/json
        body:
          catalog: "sku;quantity\nEXAMPLE-SKU;1"
          quotechar: '"'
          delimiter: ';'
          encoding: latin1
    expect:
      result_keys: [bodymessage]

  - name: headers-multipart-does-not-force-json
    request:
      operation: postMessage
      params: { careFolderId: 1 }
      multipart:
        message: Synthetic message
    mock:
      responses:
        - status: 201
          body: { id: 1 }
    wire:
      - method: POST
        path: /ws/sav/1/msg
        headers_match:
          content-type: ^multipart/form-data; boundary=
        parts:
          message: [Synthetic message]
    expect:
      result: { id: 1 }

  - name: redirect-is-an-error-not-followed
    request:
      operation: get-ws-specific-order
      params: { order_id: 1 }
    mock:
      responses:
        - status: 302
          headers: { location: /ws/orders/2 }
    wire:
      - method: GET
        path: /ws/orders/1
    expect:
      error: { kind: api, status: 302 }

  - name: redirect-of-a-post-is-not-followed
    request:
      operation: postRefundCreate
      body: { amount: 1, orderline_pk: 1, refund_type: 4 }
    mock:
      responses:
        - status: 307
          headers: { location: /ws/sav/refund-elsewhere }
    wire:
      - method: POST
        path: /ws/sav/refund
    expect:
      error: { kind: api, status: 307 }

  - name: permanent-redirect-is-an-error-not-followed
    request:
      operation: get-ws-specific-order
      params: { order_id: 1 }
    mock:
      responses:
        - status: 301
          headers: { location: /ws/orders/2 }
    wire:
      - method: GET
        path: /ws/orders/1
    expect:
      error: { kind: api, status: 301 }

  - name: see-other-after-a-post-is-not-followed
    request:
      operation: postRefundCreate
      body: { amount: 1, orderline_pk: 1, refund_type: 4 }
    mock:
      responses:
        - status: 303
          headers: { location: /ws/sav/refund-status }
    wire:
      - method: POST
        path: /ws/sav/refund
    expect:
      error: { kind: api, status: 303 }

  - name: permanent-redirect-of-a-post-is-not-followed
    request:
      operation: postRefundCreate
      body: { amount: 1, orderline_pk: 1, refund_type: 4 }
    mock:
      responses:
        - status: 308
          headers: { location: /ws/sav/refund-elsewhere }
    wire:
      - method: POST
        path: /ws/sav/refund
    expect:
      error: { kind: api, status: 308 }
