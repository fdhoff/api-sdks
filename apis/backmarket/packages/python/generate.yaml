# How `npm run generate:python` builds this package. Public method names are in operations.yaml.
generator: python
output: src/backmarket_seller
generated: [api, models]
resources: _resources.py
runtime: _runtime
# Ruff's lint fixes drop the duplicate and unused imports the generator writes, then the formatter runs.
format: [sh, -c, 'python -m ruff check --fix-only --quiet "$1" && python -m ruff format --quiet "$1"', --]
properties:
  packageName: backmarket_seller
  generateSourceCodeOnly: true
  disallowAdditionalPropertiesIfNotPresent: false
  mapNumberTo: float
# Names for the union parts only this package keeps as types. The rest are in ../names.yaml.
inline_schema_names:
  update_ws_specific_listing_request_price: ListingPrice
  update_ws_specific_listing_request_shipping_price_1: ListingShippingPrice
  update_ws_specific_listing_request_warranty_delay: IntegerOrString
