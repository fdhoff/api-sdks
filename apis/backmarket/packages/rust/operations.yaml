# Public names for every operation, keyed by operationId. Summaries are ours, not upstream's.
# `iterator` adds a method that walks every page and yields `items`.
# `string_params` narrows a parameter the spec types as a union to a plain string.
# `paging` overrides how that iterator walks pages, as set in ../../sdk.yaml.
get-bm-catalog-category: { resource: categories, method: list, summary: List the category tree. }
get-bm-catalog-category-branch: { resource: categories, method: get, summary: Get one branch of the category tree. }

get-ws-list-listing: { resource: listings, method: list, iterator: iter, items: ListingPublic, summary: List one page of listings. }
post-ws-create-or-update-listings: { resource: listings, method: batch_update, summary: Create or update listings from a CSV catalog. }
get-ws-specific-listing: { resource: listings, method: get, string_params: [listingId], summary: Get one listing. }
update-ws-specific-listing: { resource: listings, method: update, string_params: [listingId], summary: Update one listing. }
get-ws-listing-detail: { resource: listings, method: find, summary: Find one listing by SKU or identifier. }

get-ws-task: { resource: tasks, method: get, summary: Get the state of a background task. }

get-ws-buyback-v1-orders: { resource: buyback, method: list_orders, iterator: iter_orders, items: BuybackOrder, summary: List one page of buyback orders. }
get-ws-buyback-v1-orders-pending-reply: { resource: buyback, method: list_pending_orders, iterator: iter_pending_orders, items: BuybackOrder, summary: List one page of buyback orders awaiting a reply. }
get-ws-buyback-v1-orders-suspend-reasons: { resource: buyback, method: list_suspend_reasons, summary: List the reasons a buyback order can be suspended. }
get-ws-buyback-v1-order: { resource: buyback, method: get_order, summary: Get one buyback order. }
get-ws-buyback-v1-orders-messages: { resource: buyback, method: list_messages, iterator: iter_messages, items: BuybackMessage, summary: List one page of a buyback order's messages. }
post-ws-buyback-v1-orders-messages: { resource: buyback, method: send_message, summary: Send a message on a buyback order. }
put-ws-buyback-v1-orders-suspend: { resource: buyback, method: suspend_order, summary: Suspend a buyback order. }
put-ws-buyback-v1-orders-validate: { resource: buyback, method: validate_order, summary: Validate a buyback order. }
get-ws-counter-offer-reason: { resource: buyback, method: list_counter_offer_reasons, summary: List the counter-offer reasons for a buyback order. }
put-ws-refurbisher-counter-offer: { resource: buyback, method: counter_offer, summary: Make a counter-offer on a buyback order. }
get-ws-buyback-v1-listings: { resource: buyback, method: list_listings, iterator: iter_listings, items: BuybackListing, summary: List one page of buyback listings. }
get-ws-buyback-v1-listing: { resource: buyback, method: get_listing, summary: Get one buyback listing. }
put-ws-buyback-v1-listing: { resource: buyback, method: update_listing, summary: Update one buyback listing. }
get-ws-buyback-v1-competitors: { resource: buyback, method: list_competitors, summary: List competitors for a buyback listing. }

get-ws-list-order: { resource: orders, method: list, iterator: iter, items: Order, summary: List one page of orders. }
get-ws-specific-order: { resource: orders, method: get, summary: Get one order. }
update-ws-specific-order: { resource: orders, method: update, summary: Update one order. }
post-ws-specific-order-invoice: { resource: orders, method: upload_invoice, summary: Upload invoices for an order. }
update-ws-specific-orderline: { resource: orders, method: update_line, summary: Update one order line. }

GetDeliveries: { resource: shipping, method: list_deliveries, iterator: iter_deliveries, items: Delivery, summary: List one page of deliveries. }
GetReturns: { resource: shipping, method: list_returns, iterator: iter_returns, items: ReturnShipment, summary: List one page of returns. }
GetDelivery: { resource: shipping, method: get_delivery, summary: Get one delivery. }
GetReturn: { resource: shipping, method: get_return, summary: Get one return. }

getCareFolderList: { resource: care, method: list_folders, iterator: iter_folders, items: CareFolder, summary: List one page of care folders. }
getCareFolderDetails: { resource: care, method: get_folder, summary: Get one care folder. }
postProblem: { resource: care, method: report_problem, summary: Report a problem on a care folder. }
postRefundCreate: { resource: care, method: create_refund, summary: Create a refund. Never retried on failure. }
postMessage: { resource: care, method: send_message, summary: Send a message on a care folder. }
postItemTransfer: { resource: care, method: transfer_item, summary: Transfer an item on a care folder. }
postNote: { resource: care, method: add_note, summary: Add a note to a care folder. }

GetBackboxData: { resource: backbox, method: list, iterator: iter, items: Backbox, summary: List one page of Backbox data. }
get-ws-backbox-v1-competitors: { resource: backbox, method: list_competitors, summary: List competitors for a listing. }
