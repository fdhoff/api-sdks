# How `npm run generate:rust` builds this package. Public method names are in operations.yaml.
generator: rust
output: src
source: src
generated: [apis, models]
resources: resources.rs
runtime: runtime
ignore: [src/apis/configuration.rs]
supporting_files:
  dispatch.mustache: conformance/dispatch.rs
format: [sh, -c, cargo fmt, --]
properties:
  packageName: backmarket_seller
  library: reqwest
# Every field is an Option here, so None already means null or absent.
drop_nullable: true
# A field of several types becomes a serde_json::Value.
drop_unions: true
type_mappings:
  integer: i64
  i32: i64
  float: f64
  file: File
  File: File
  binary: File
  DateTime: chrono::DateTime<chrono::FixedOffset>
  date: String
  UUID: String
  URI: String
# These two differ only by case and spacing, so Rust needs a second name.
enum_name_mappings:
  'DHL  EXPRESS': DhlExpressUppercase
