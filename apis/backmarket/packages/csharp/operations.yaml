# Public names for every operation, keyed by operationId. Summaries are ours, not upstream's.
# `iterator` adds a method that returns every item across all pages as an IAsyncEnumerable of `items`.
# `string_params` narrows a parameter the spec types as a union to a plain string.
# `paging` overrides how that iterator walks pages, as set in ../../sdk.yaml.
get-bm-catalog-category: { resource: Categories, method: ListAsync, summary: List the category tree. }
get-bm-catalog-category-branch: { resource: Categories, method: GetAsync, summary: Get one branch of the category tree. }

get-ws-list-listing: { resource: Listings, method: ListAsync, iterator: ListAllAsync, items: ListingPublic, summary: List one page of listings. }
post-ws-create-or-update-listings: { resource: Listings, method: BatchUpdateAsync, summary: Create or update listings from a CSV catalog. }
get-ws-specific-listing: { resource: Listings, method: GetAsync, string_params: [listingId], summary: Get one listing. }
update-ws-specific-listing: { resource: Listings, method: UpdateAsync, string_params: [listingId], summary: Update one listing. }
get-ws-listing-detail: { resource: Listings, method: FindAsync, summary: Find one listing by SKU or identifier. }

get-ws-task: { resource: Tasks, method: GetAsync, summary: Get the state of a background task. }

get-ws-buyback-v1-orders: { resource: Buyback, method: ListOrdersAsync, iterator: ListAllOrdersAsync, items: BuybackOrder, summary: List one page of buyback orders. }
get-ws-buyback-v1-orders-pending-reply: { resource: Buyback, method: ListPendingOrdersAsync, iterator: ListAllPendingOrdersAsync, items: BuybackOrder, summary: List one page of buyback orders awaiting a reply. }
get-ws-buyback-v1-orders-suspend-reasons: { resource: Buyback, method: ListSuspendReasonsAsync, summary: List the reasons a buyback order can be suspended. }
get-ws-buyback-v1-order: { resource: Buyback, method: GetOrderAsync, summary: Get one buyback order. }
get-ws-buyback-v1-orders-messages: { resource: Buyback, method: ListMessagesAsync, iterator: ListAllMessagesAsync, items: BuybackMessage, summary: List one page of a buyback order's messages. }
post-ws-buyback-v1-orders-messages: { resource: Buyback, method: SendMessageAsync, summary: Send a message on a buyback order. }
put-ws-buyback-v1-orders-suspend: { resource: Buyback, method: SuspendOrderAsync, summary: Suspend a buyback order. }
put-ws-buyback-v1-orders-validate: { resource: Buyback, method: ValidateOrderAsync, summary: Validate a buyback order. }
get-ws-counter-offer-reason: { resource: Buyback, method: ListCounterOfferReasonsAsync, summary: List the counter-offer reasons for a buyback order. }
put-ws-refurbisher-counter-offer: { resource: Buyback, method: CounterOfferAsync, summary: Make a counter-offer on a buyback order. }
get-ws-buyback-v1-listings: { resource: Buyback, method: ListListingsAsync, iterator: ListAllListingsAsync, items: BuybackListing, summary: List one page of buyback listings. }
get-ws-buyback-v1-listing: { resource: Buyback, method: GetListingAsync, summary: Get one buyback listing. }
put-ws-buyback-v1-listing: { resource: Buyback, method: UpdateListingAsync, summary: Update one buyback listing. }
get-ws-buyback-v1-competitors: { resource: Buyback, method: ListCompetitorsAsync, summary: List competitors for a buyback listing. }

get-ws-list-order: { resource: Orders, method: ListAsync, iterator: ListAllAsync, items: Order, summary: List one page of orders. }
get-ws-specific-order: { resource: Orders, method: GetAsync, summary: Get one order. }
update-ws-specific-order: { resource: Orders, method: UpdateAsync, summary: Update one order. }
post-ws-specific-order-invoice: { resource: Orders, method: UploadInvoiceAsync, summary: Upload invoices for an order. }
update-ws-specific-orderline: { resource: Orders, method: UpdateLineAsync, summary: Update one order line. }

GetDeliveries: { resource: Shipping, method: ListDeliveriesAsync, iterator: ListAllDeliveriesAsync, items: Delivery, summary: List one page of deliveries. }
GetReturns: { resource: Shipping, method: ListReturnsAsync, iterator: ListAllReturnsAsync, items: ReturnShipment, summary: List one page of returns. }
GetDelivery: { resource: Shipping, method: GetDeliveryAsync, summary: Get one delivery. }
GetReturn: { resource: Shipping, method: GetReturnAsync, summary: Get one return. }

getCareFolderList: { resource: Care, method: ListFoldersAsync, iterator: ListAllFoldersAsync, items: CareFolder, summary: List one page of care folders. }
getCareFolderDetails: { resource: Care, method: GetFolderAsync, summary: Get one care folder. }
postProblem: { resource: Care, method: ReportProblemAsync, summary: Report a problem on a care folder. }
postRefundCreate: { resource: Care, method: CreateRefundAsync, summary: Create a refund. Never retried on failure. }
postMessage: { resource: Care, method: SendMessageAsync, summary: Send a message on a care folder. }
postItemTransfer: { resource: Care, method: TransferItemAsync, summary: Transfer an item on a care folder. }
postNote: { resource: Care, method: AddNoteAsync, summary: Add a note to a care folder. }

GetBackboxData: { resource: Backbox, method: ListAsync, iterator: ListAllAsync, items: Backbox, summary: List one page of Backbox data. }
get-ws-backbox-v1-competitors: { resource: Backbox, method: ListCompetitorsAsync, summary: List competitors for a listing. }
