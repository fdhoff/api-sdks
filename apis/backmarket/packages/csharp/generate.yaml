# How `npm run generate:csharp` builds this package. Public method names are in operations.yaml.
generator: csharp
output: src/BackMarketSeller
source: src/BackMarketSeller
generated: [Api, Models]
resources: ClientResources.cs
runtime: Runtime
# The runtime's namespaces are written with a placeholder, because C# has no relative imports.
runtime_package: BackMarketSeller
format: [dotnet, format, whitespace, --folder]
properties:
  packageName: BackMarketSeller
  library: httpclient
  apiPackage: Api
  modelPackage: Models
  apiNameSuffix: Resource
  disallowAdditionalPropertiesIfNotPresent: false
  nullableReferenceTypes: true
  useDateTimeOffset: true
# Every property is nullable here, so null already means null or absent.
drop_nullable: true
# A value of several types becomes `object`, which reads as a JsonElement.
drop_unions: true
type_mappings:
  integer: long
  AnyType: object
  object: object
  file: UploadFile
  binary: UploadFile
# About 100 carrier names, two of which differ only by spacing. A string also takes carriers this version does not list.
schema_mappings:
  Shipper: string
# Care's lowercase schemas differ from others only by case, and `Return` is a reserved word.
schema_names:
  address: CareAddress
  client: CareClient
  order: CareOrder
  orderline: CareOrderline
  Return: ReturnShipment
# Inline schemas would otherwise be named after their operation. `Task` would hide System.Threading.Tasks.Task.
inline_schema_names:
  GetBackboxData_200_response: BackboxPage
  GetDeliveries_200_response: DeliveryPage
  GetReturns_200_response: ReturnPage
  get_ws_buyback_v1_orders_200_response: BuybackOrderPage
  get_ws_buyback_v1_orders_messages_200_response: BuybackMessagePage
  get_ws_list_listing_200_response: ListingPage
  get_ws_list_order_200_response: OrderPage
  get_ws_specific_listing_200_response: ListingDetail
  get_ws_task_200_response: BackgroundTask
  post_ws_create_or_update_listings_200_response: ListingsBatch
  post_ws_create_or_update_listings_request: ListingsCatalog
  update_ws_specific_listing_200_response: UpdatedListing
  update_ws_specific_listing_request: ListingUpdate
  update_ws_specific_orderline_200_response: UpdatedOrderLine
  update_ws_specific_orderline_request: OrderLineUpdate
  Payload: BuybackListingUpdate
# Supporting files the generator would otherwise add to a generated directory.
ignore: [src/BackMarketSeller/Models/AbstractOpenAPISchema.cs]
