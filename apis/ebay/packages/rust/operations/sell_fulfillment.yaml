# Public names for the Fulfillment API, keyed by operationId. Summaries are ours, not upstream's.
getOrders: { resource: orders, method: list, iterator: iter, items: Order, paging: { items: orders }, summary: List one page of the seller's orders. }
getOrder: { resource: orders, method: get, summary: Get one order. }
issueRefund: { resource: orders, method: issue_refund, summary: Refund all or part of an order. }

getShippingFulfillments: { resource: shipping_fulfillments, method: list, summary: List the shipping fulfillments of an order. }
createShippingFulfillment: { resource: shipping_fulfillments, method: create, summary: Mark line items of an order shipped, with their tracking. }
getShippingFulfillment: { resource: shipping_fulfillments, method: get, summary: Get one shipping fulfillment. }

getPaymentDisputeSummaries: { resource: payment_disputes, method: list_summaries, iterator: iter_summaries, items: PaymentDisputeSummary, paging: { items: paymentDisputeSummaries }, summary: List one page of the seller's payment disputes. }
getPaymentDispute: { resource: payment_disputes, method: get, summary: Get one payment dispute. }
getActivities: { resource: payment_disputes, method: list_activities, summary: List the activity on a payment dispute. }
acceptPaymentDispute: { resource: payment_disputes, method: accept, summary: Accept a payment dispute. }
contestPaymentDispute: { resource: payment_disputes, method: contest, summary: Contest a payment dispute. }
uploadEvidenceFile: { resource: payment_disputes, method: upload_evidence_file, summary: Upload a file to use as evidence in a payment dispute. }
addEvidence: { resource: payment_disputes, method: add_evidence, summary: Add a set of uploaded evidence files to a payment dispute. }
updateEvidence: { resource: payment_disputes, method: update_evidence, summary: Add uploaded files to an existing set of evidence. }
fetchEvidenceContent: { omit: The file response needs binary bodies in the runtime. }
