# Public names for the Stores API, keyed by operationId. Summaries are ours, not upstream's.
getStore: { resource: store, method: get, summary: Get the seller's eBay store. }
getStoreCategories: { resource: store, method: listCategories, summary: List the categories of the seller's store. }
addStoreCategory: { resource: store, method: addCategory, summary: Start a task that adds a store category. }
renameStoreCategory: { resource: store, method: renameCategory, summary: Rename a store category. }
moveStoreCategory: { resource: store, method: moveCategory, summary: Start a task that moves a store category. }
deleteStoreCategory: { resource: store, method: deleteCategory, summary: Start a task that deletes a store category. }
getStoreTasks: { resource: store, method: listTasks, summary: List the seller's store category tasks. }
getStoreTask: { resource: store, method: getTask, summary: Get one store category task. }
