# Public names for the Inventory API, keyed by operationId. Summaries are ours, not upstream's.
getInventoryItems: { resource: inventoryItems, method: list, iterator: iter, items: InventoryItemWithSkuLocaleGroupid, paging: { items: inventoryItems }, summary: List one page of the seller's inventory items. }
getInventoryItem: { resource: inventoryItems, method: get, summary: Get one inventory item by SKU. }
createOrReplaceInventoryItem: { resource: inventoryItems, method: createOrReplace, summary: Create or replace an inventory item. }
deleteInventoryItem: { resource: inventoryItems, method: delete, summary: Delete an inventory item and its offers. }
bulkCreateOrReplaceInventoryItem: { resource: inventoryItems, method: bulkCreateOrReplace, summary: Create or replace several inventory items. }
bulkGetInventoryItem: { resource: inventoryItems, method: bulkGet, summary: Get several inventory items by SKU. }
bulkUpdatePriceQuantity: { resource: inventoryItems, method: bulkUpdatePriceQuantity, summary: Update the price and quantity of several inventory items and their offers. }

getProductCompatibility: { resource: productCompatibility, method: get, summary: Get the vehicles an inventory item fits. }
createOrReplaceProductCompatibility: { resource: productCompatibility, method: createOrReplace, summary: Set the vehicles an inventory item fits. }
deleteProductCompatibility: { resource: productCompatibility, method: delete, summary: Remove the vehicle list of an inventory item. }

getInventoryItemGroup: { resource: inventoryItemGroups, method: get, summary: Get one inventory item group. }
createOrReplaceInventoryItemGroup: { resource: inventoryItemGroups, method: createOrReplace, summary: Create or replace an inventory item group for a multi-variation listing. }
deleteInventoryItemGroup: { resource: inventoryItemGroups, method: delete, summary: Delete an inventory item group. }

bulkMigrateListing: { resource: listings, method: bulkMigrate, summary: Move existing listings into the Inventory API. }
getSkuLocationMapping: { resource: listings, method: getSkuLocations, summary: Get the fulfillment locations of a SKU in a listing. }
createOrReplaceSkuLocationMapping: { resource: listings, method: setSkuLocations, summary: Set the fulfillment locations of a SKU in a listing. }
deleteSkuLocationMapping: { resource: listings, method: deleteSkuLocations, summary: Remove the fulfillment locations of a SKU in a listing. }

getOffers: { resource: offers, method: list, iterator: iter, items: EbayOfferDetailsWithAll, paging: { items: offers }, summary: List one page of the offers of a SKU. }
getOffer: { resource: offers, method: get, summary: Get one offer. }
createOffer: { resource: offers, method: create, summary: Create an unpublished offer for an inventory item. }
updateOffer: { resource: offers, method: update, summary: Replace an offer. }
deleteOffer: { resource: offers, method: delete, summary: Delete an offer, ending its listing if published. }
bulkCreateOffer: { resource: offers, method: bulkCreate, summary: Create several unpublished offers. }
getListingFees: { resource: offers, method: getListingFees, summary: Estimate the listing fees of unpublished offers. }
publishOffer: { resource: offers, method: publish, summary: Publish an offer as a listing. }
bulkPublishOffer: { resource: offers, method: bulkPublish, summary: Publish several offers as listings. }
publishOfferByInventoryItemGroup: { resource: offers, method: publishByInventoryItemGroup, summary: Publish the offers of an inventory item group as one multi-variation listing. }
withdrawOffer: { resource: offers, method: withdraw, summary: End the listing of an offer and keep the offer. }
withdrawOfferByInventoryItemGroup: { resource: offers, method: withdrawByInventoryItemGroup, summary: End the multi-variation listing of an inventory item group. }

getInventoryLocations: { resource: locations, method: list, iterator: iter, items: InventoryLocationResponse, paging: { items: locations }, summary: List one page of the seller's inventory locations. }
getInventoryLocation: { resource: locations, method: get, summary: Get one inventory location. }
createInventoryLocation: { resource: locations, method: create, summary: Create an inventory location. }
updateInventoryLocation: { resource: locations, method: update, summary: Update the details of an inventory location. }
deleteInventoryLocation: { resource: locations, method: delete, summary: Delete an inventory location. }
disableInventoryLocation: { resource: locations, method: disable, summary: Disable an inventory location. }
enableInventoryLocation: { resource: locations, method: enable, summary: Enable a disabled inventory location. }
