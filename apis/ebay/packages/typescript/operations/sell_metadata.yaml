# Public names for the Metadata API, keyed by operationId. Summaries are ours, not upstream's.
getAutomotivePartsCompatibilityPolicies: { resource: marketplaces, method: getAutomotivePartsCompatibilityPolicies, summary: List the categories of a marketplace that support parts compatibility. }
getCategoryPolicies: { resource: marketplaces, method: getCategoryPolicies, summary: List the listing policies of a marketplace's categories. }
getClassifiedAdPolicies: { resource: marketplaces, method: getClassifiedAdPolicies, summary: List the classified ad policies of a marketplace's categories. }
getCurrencies: { resource: marketplaces, method: getCurrencies, summary: Get the default currency of a marketplace. }
getExtendedProducerResponsibilityPolicies: { resource: marketplaces, method: getExtendedProducerResponsibilityPolicies, summary: List the extended producer responsibility policies of a marketplace's categories. }
getHazardousMaterialsLabels: { resource: marketplaces, method: getHazardousMaterialsLabels, summary: List the hazardous materials labels a marketplace accepts. }
getItemConditionPolicies: { resource: marketplaces, method: getItemConditionPolicies, summary: List the item conditions a marketplace's categories accept. }
getListingStructurePolicies: { resource: marketplaces, method: getListingStructurePolicies, summary: List which of a marketplace's categories accept multi-variation listings. }
getListingTypePolicies: { resource: marketplaces, method: getListingTypePolicies, summary: List the listing formats and durations of a marketplace's categories. }
getMotorsListingPolicies: { resource: marketplaces, method: getMotorsListingPolicies, summary: List the motors listing policies of a marketplace's categories. }
getNegotiatedPricePolicies: { resource: marketplaces, method: getNegotiatedPricePolicies, summary: List the Best Offer policies of a marketplace's categories. }
getProductSafetyLabels: { resource: marketplaces, method: getProductSafetyLabels, summary: List the product safety labels a marketplace accepts. }
getRegulatoryPolicies: { resource: marketplaces, method: getRegulatoryPolicies, summary: List the regulatory policies of a marketplace's categories. }
getReturnPolicies: { resource: marketplaces, method: getReturnPolicies, summary: List the return policies of a marketplace's categories. }
getShippingPolicies: { resource: marketplaces, method: getShippingPolicies, summary: List the shipping policies of a marketplace's categories. }
getSiteVisibilityPolicies: { resource: marketplaces, method: getSiteVisibilityPolicies, summary: List which of a marketplace's categories show on other marketplaces. }

getCompatibilitiesBySpecification: { resource: compatibilities, method: getBySpecification, summary: List the vehicles that match a parts specification. }
getCompatibilityPropertyNames: { resource: compatibilities, method: getPropertyNames, summary: List the compatibility property names of a category. }
getCompatibilityPropertyValues: { resource: compatibilities, method: getPropertyValues, summary: List the values of one compatibility property. }
getMultiCompatibilityPropertyValues: { resource: compatibilities, method: getMultiPropertyValues, summary: List the values of several compatibility properties. }
getProductCompatibilities: { resource: compatibilities, method: getProductCompatibilities, summary: List the vehicles a product fits. }

getExcludeShippingLocations: { resource: shipping, method: getExcludedLocations, summary: List the regions and countries a seller can exclude from shipping. }
getHandlingTimes: { resource: shipping, method: getHandlingTimes, summary: List the handling times a marketplace accepts. }
getShippingCarriers: { resource: shipping, method: getCarriers, summary: List the shipping carriers of a marketplace. }
getShippingLocations: { resource: shipping, method: getLocations, summary: List the shipping locations of a marketplace. }
getShippingServices: { resource: shipping, method: getServices, summary: List the shipping services of a marketplace. }

getSalesTaxJurisdictions: { resource: countries, method: getSalesTaxJurisdictions, summary: List the sales tax jurisdictions of a country. }
