[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ebay-sell"
dynamic = ["version"]
description = "Unofficial Python client for eBay's Sell, Commerce and Developer REST APIs. Not affiliated with, endorsed by or sponsored by eBay Inc."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
# For the message signer, which EU and UK sellers need on some calls.
signing = ["cryptography>=42"]
dev = [
    "build==1.3.0",
    "cryptography==50.0.2",
    "mypy==2.4.1",
    "pytest==9.0.2",
    "ruff==0.17.3",
]

[tool.hatch.version]
path = "src/ebay_sell/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ebay_sell"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
exclude = ["src/ebay_sell/*/models/*"]

[tool.ruff.lint.per-file-ignores]
"src/ebay_sell/*/api/*" = ["UP"]
"src/ebay_sell/*/_resources.py" = ["UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "conformance", "sandbox", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
