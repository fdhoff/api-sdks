# How `npm run generate:go` builds this package. Each contract becomes a sub-package with its own models,
# so schema names that repeat across contracts never collide. Public method names are in operations/.
generator: go
output: ebaysell
source: .
generated_prefixes: [model_, api_]
resources: resources.go
runtime: ../internal/runtime
format: [gofmt, -s, -r, 'interface{} -> any', -w]
properties:
  disallowAdditionalPropertiesIfNotPresent: false
  withGoMod: false
  apiNameSuffix: Resource
  modulePath: github.com/fdhoff/api-sdks/apis/ebay/packages/go
# A union of one schema is typed as that schema.
collapse_single_unions: true
# Every field is a pointer here, so nil already means null or absent.
drop_nullable: true
# A field of several types becomes `any`.
drop_unions: true
type_mappings:
  integer: int64
  number: float64
  file: File
  File: File
  binary: File
  DateTime: Time
# Go spells these initialisms in capitals. Keys are wire names.
