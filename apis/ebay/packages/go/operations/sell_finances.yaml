# Public names for the Finances API, keyed by operationId. Summaries are ours, not upstream's.
getOrderEarnings: { resource: OrderEarnings, method: List, iterator: Iter, items: OrderEarning, paging: { items: orders }, summary: "List lists one page of the seller's earnings by order." }
getOrderEarningsById: { resource: OrderEarnings, method: Get, summary: "Get gets the seller's earnings from one order." }
getOrderEarningsSummary: { resource: OrderEarnings, method: GetSummary, summary: "GetSummary sums the seller's earnings across orders." }

getPayouts: { resource: Payouts, method: List, iterator: Iter, items: Payout, paging: { items: payouts }, summary: "List lists one page of the seller's payouts." }
getPayout: { resource: Payouts, method: Get, summary: Get gets one payout. }
getPayoutSummary: { resource: Payouts, method: GetSummary, summary: "GetSummary sums the seller's payouts." }

getSellerFundsSummary: { resource: SellerFunds, method: GetSummary, summary: "GetSummary gets the seller's funds that are not yet paid out." }

getTransactions: { resource: Transactions, method: List, iterator: Iter, items: Transaction, paging: { items: transactions }, summary: "List lists one page of the seller's monetary transactions." }
getTransactionSummary: { resource: Transactions, method: GetSummary, summary: "GetSummary sums the seller's monetary transactions by type." }

getTransfer: { resource: Transfers, method: Get, summary: Get gets one transfer of funds the seller owes eBay. }

getBillingActivities: { resource: BillingActivities, method: List, iterator: Iter, items: BillingActivityLineItem, paging: { items: billingActivities }, summary: "List lists one page of the seller's billing activities." }
