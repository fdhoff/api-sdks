# Public names for the Developer Analytics API, keyed by operationId. Summaries are ours, not upstream's.
getRateLimits: { resource: RateLimits, method: List, summary: "List lists the app's call limits and current usage." }
getUserRateLimits: { resource: RateLimits, method: ListForUser, summary: ListForUser lists the call limits and current usage of the user the token belongs to. }
