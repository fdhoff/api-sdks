# Public names for the Feedback API, keyed by operationId. Summaries are ours, not upstream's.
# `iterator` adds a method that returns every item across all pages as an IAsyncEnumerable of `items`.
getItemsAwaitingFeedback: { resource: Feedback, method: ListAwaitingAsync, summary: List one page of the order line items still waiting for feedback. }
getFeedback: { resource: Feedback, method: ListAsync, summary: List one page of feedback a user left or received. }
leaveFeedback: { resource: Feedback, method: LeaveAsync, summary: Leave feedback for the other party of an order line item. }
getFeedbackRatingSummary: { resource: Feedback, method: GetRatingSummaryAsync, summary: "Get a user's feedback rating summary." }
respondToFeedback: { resource: Feedback, method: RespondAsync, summary: Reply to feedback }
