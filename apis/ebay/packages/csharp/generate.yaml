  developer_analytics: { output: src/EbaySell/DeveloperAnalytics, source: src/EbaySell.DeveloperAnalytics, operations: operations/developer_analytics.yaml, properties: { packageName: EbaySell.DeveloperAnalytics, sdkContract: developer_analytics }, ignore: [src/EbaySell.DeveloperAnalytics/Models/AbstractOpenAPISchema.cs] }
  developer_key_management: { output: src/EbaySell/KeyManagement, source: src/EbaySell.KeyManagement, operations: operations/developer_key_management.yaml, properties: { packageName: EbaySell.KeyManagement, sdkContract: developer_key_management }, ignore: [src/EbaySell.KeyManagement/Models/AbstractOpenAPISchema.cs] }
