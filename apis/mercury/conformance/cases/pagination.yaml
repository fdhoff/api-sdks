# Most lists page by cursor: each page's `page.nextPage` goes back as `start_after` until it is null or absent.
# listAccountTransactions pages by `offset` up to `total`, and getTreasuryTransactions sends its top-level
# integer `cursor` back as `cursor`.
cases:
  - name: pagination-cursor-follows-next-page-across-several-pages
    request:
      operation: getAccounts
      params: { limit: 2 }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { accounts: [{ id: 00000000-0000-4000-8000-acc000000001 }, { id: 00000000-0000-4000-8000-acc000000002 }], page: { nextPage: 00000000-0000-4000-8000-acc000000002, previousPage: null } }
        - status: 200
          body: { accounts: [{ id: 00000000-0000-4000-8000-acc000000003 }, { id: 00000000-0000-4000-8000-acc000000004 }], page: { nextPage: 00000000-0000-4000-8000-acc000000004, previousPage: 00000000-0000-4000-8000-acc000000003 } }
        - status: 200
          body: { accounts: [{ id: 00000000-0000-4000-8000-acc000000005 }], page: { nextPage: null, previousPage: 00000000-0000-4000-8000-acc000000005 } }
    wire:
      - method: GET
        path: /accounts
        query: { limit: '2' }
      - method: GET
        path: /accounts
        query: { limit: '2', start_after: 00000000-0000-4000-8000-acc000000002 }
      - method: GET
        path: /accounts
        query: { limit: '2', start_after: 00000000-0000-4000-8000-acc000000004 }
    expect:
      result: [{ id: 00000000-0000-4000-8000-acc000000001 }, { id: 00000000-0000-4000-8000-acc000000002 }, { id: 00000000-0000-4000-8000-acc000000003 }, { id: 00000000-0000-4000-8000-acc000000004 }, { id: 00000000-0000-4000-8000-acc000000005 }]

  - name: pagination-cursor-keeps-the-callers-position-and-filters
    request:
      operation: listTransactions
      params: { limit: 1, start_after: 00000000-0000-4000-8000-7a4000000000, status: [sent], order: asc }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { transactions: [{ id: 00000000-0000-4000-8000-7a4000000001 }], page: { nextPage: 00000000-0000-4000-8000-7a4000000001 } }
        - status: 200
          body: { transactions: [{ id: 00000000-0000-4000-8000-7a4000000002 }], page: {} }
    wire:
      - method: GET
        path: /transactions
        query: { limit: '1', start_after: 00000000-0000-4000-8000-7a4000000000, status: sent, order: asc }
      - method: GET
        path: /transactions
        query: { limit: '1', start_after: 00000000-0000-4000-8000-7a4000000001, status: sent, order: asc }
    expect:
      result: [{ id: 00000000-0000-4000-8000-7a4000000001 }, { id: 00000000-0000-4000-8000-7a4000000002 }]

  - name: pagination-cursor-stops-after-an-empty-last-page
    request:
      operation: listMerchants
      paginate: true
    mock:
      responses:
        - status: 200
          body: { data: [{ id: 00000000-0000-4000-8000-3e4c00000001 }], page: { nextPage: 00000000-0000-4000-8000-3e4c00000001 } }
        - status: 200
          body: { data: [], page: { nextPage: null } }
    wire:
      - method: GET
        path: /merchants
      - method: GET
        path: /merchants
        query: { start_after: 00000000-0000-4000-8000-3e4c00000001 }
    expect:
      result: [{ id: 00000000-0000-4000-8000-3e4c00000001 }]

  - name: pagination-cursor-repeated-is-a-decode-error
    request:
      operation: getEvents
      params: { start_after: 00000000-0000-4000-8000-e7e400000001 }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { events: [{ id: 00000000-0000-4000-8000-e7e400000002 }], page: { nextPage: 00000000-0000-4000-8000-e7e400000001 } }
    wire:
      - method: GET
        path: /events
        query: { start_after: 00000000-0000-4000-8000-e7e400000001 }
    expect:
      error: { kind: decode }

  - name: pagination-cursor-that-cycles-back-is-a-decode-error
    request:
      operation: getEvents
      paginate: true
    mock:
      responses:
        - status: 200
          body: { events: [{ id: 00000000-0000-4000-8000-e7e400000001 }], page: { nextPage: 00000000-0000-4000-8000-e7e400000001 } }
        - status: 200
          body: { events: [{ id: 00000000-0000-4000-8000-e7e400000002 }], page: { nextPage: 00000000-0000-4000-8000-e7e400000002 } }
        - status: 200
          body: { events: [{ id: 00000000-0000-4000-8000-e7e400000001 }], page: { nextPage: 00000000-0000-4000-8000-e7e400000001 } }
    wire:
      - method: GET
        path: /events
      - method: GET
        path: /events
        query: { start_after: 00000000-0000-4000-8000-e7e400000001 }
      - method: GET
        path: /events
        query: { start_after: 00000000-0000-4000-8000-e7e400000002 }
    expect:
      error: { kind: decode }

  - name: pagination-cursor-page-without-its-items-is-a-decode-error
    request:
      operation: listCards
      paginate: true
    mock:
      responses:
        - status: 200
          body: { page: { nextPage: null } }
    wire:
      - method: GET
        path: /cards
    expect:
      error: { kind: decode }

  - name: pagination-offset-advances-to-the-total
    request:
      operation: listAccountTransactions
      params: { accountId: 00000000-0000-4000-8000-acc000000001, limit: 2 }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { total: 3, transactions: [{ id: 00000000-0000-4000-8000-7a4000000001 }, { id: 00000000-0000-4000-8000-7a4000000002 }] }
        - status: 200
          body: { total: 3, transactions: [{ id: 00000000-0000-4000-8000-7a4000000003 }] }
    wire:
      - method: GET
        path: /account/00000000-0000-4000-8000-acc000000001/transactions
        query: { limit: '2' }
      - method: GET
        path: /account/00000000-0000-4000-8000-acc000000001/transactions
        query: { limit: '2', offset: '2' }
    expect:
      result: [{ id: 00000000-0000-4000-8000-7a4000000001 }, { id: 00000000-0000-4000-8000-7a4000000002 }, { id: 00000000-0000-4000-8000-7a4000000003 }]

  - name: pagination-offset-keeps-the-callers-offset-and-stops-at-an-empty-page
    request:
      operation: listAccountTransactions
      params: { accountId: 00000000-0000-4000-8000-acc000000001, offset: 5 }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { total: 100, transactions: [{ id: 00000000-0000-4000-8000-7a4000000006 }] }
        - status: 200
          body: { total: 100, transactions: [] }
    wire:
      - method: GET
        path: /account/00000000-0000-4000-8000-acc000000001/transactions
        query: { offset: '5' }
      - method: GET
        path: /account/00000000-0000-4000-8000-acc000000001/transactions
        query: { offset: '6' }
    expect:
      result: [{ id: 00000000-0000-4000-8000-7a4000000006 }]

  - name: pagination-treasury-sends-the-integer-cursor-back
    request:
      operation: getTreasuryTransactions
      params: { treasuryId: 00000000-0000-4000-8000-74e500000001, limit: 2 }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { transactions: [{ id: ttx-1 }, { id: ttx-2 }], cursor: 40 }
        - status: 200
          body: { transactions: [{ id: ttx-3 }], cursor: 0 }
        - status: 200
          body: { transactions: [], cursor: null }
    wire:
      - method: GET
        path: /treasury/00000000-0000-4000-8000-74e500000001/transactions
        query: { limit: '2' }
      - method: GET
        path: /treasury/00000000-0000-4000-8000-74e500000001/transactions
        query: { limit: '2', cursor: '40' }
      - method: GET
        path: /treasury/00000000-0000-4000-8000-74e500000001/transactions
        query: { limit: '2', cursor: '0' }
    expect:
      result: [{ id: ttx-1 }, { id: ttx-2 }, { id: ttx-3 }]

  - name: pagination-treasury-stops-without-a-cursor
    request:
      operation: getTreasuryTransactions
      params: { treasuryId: 00000000-0000-4000-8000-74e500000001 }
      paginate: true
    mock:
      responses:
        - status: 200
          body: { transactions: [{ id: ttx-1 }] }
    wire:
      - method: GET
        path: /treasury/00000000-0000-4000-8000-74e500000001/transactions
    expect:
      result: [{ id: ttx-1 }]
