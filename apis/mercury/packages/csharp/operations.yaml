# Public names for every operation, keyed by operationId. Summaries are ours, not upstream's.
# `iterator` adds a method that returns every item across all pages as an IAsyncEnumerable of `items`. Each page's list
# and its paging are the ones ../../sdk.yaml gives under `iterators`; operations.yaml repeats them until generate.mjs
# reads them from there.
# `idempotency` lets a money-moving write be retried like a GET when its `idempotencyKey` is set, as in ../../sdk.yaml.
getAccounts: { resource: Accounts, method: ListAsync, iterator: ListAllAsync, items: Account, paging: { items: accounts }, summary: List one page of your accounts. }
getAccountCards: { resource: Accounts, method: ListCardsAsync, summary: List the cards issued on an account. }
getAccountStatements: { resource: Accounts, method: ListStatementsAsync, iterator: ListAllStatementsAsync, items: DepositoryAccountStatement, paging: { items: statements }, summary: List one page of an account's statements. }
listAccountTransactions: { resource: Accounts, method: ListTransactionsAsync, iterator: ListAllTransactionsAsync, items: Transaction, paging: { style: offset, items: transactions, total: total }, summary: List one page of an account's transactions. }
getTransaction: { resource: Accounts, method: GetTransactionAsync, summary: Get one transaction of an account. }
createTransaction: { resource: Accounts, method: SendMoneyAsync, idempotency: { body: idempotencyKey }, summary: Send money from an account to a recipient. }
requestSendMoney: { resource: Accounts, method: RequestSendMoneyAsync, idempotency: { body: idempotencyKey }, summary: "Ask to send money from an account, subject to your approval policy." }
createInternalTransfer: { resource: Accounts, method: TransferAsync, idempotency: { body: idempotencyKey }, summary: Move money between two of your accounts. }

getAutoTransferRules: { resource: AutoTransferRules, method: ListAsync, iterator: ListAllAsync, items: AutoTransferRule, paging: { items: rules }, summary: List one page of automatic transfer rules. }

listBudgets: { resource: Budgets, method: ListAsync, iterator: ListAllAsync, items: ApiV1SpendBudgetResponse, paging: { items: budgets }, summary: List one page of budgets. }
getBudget: { resource: Budgets, method: GetAsync, summary: Get one budget. }
createBudget: { resource: Budgets, method: CreateAsync, summary: Create a budget. }
updateBudget: { resource: Budgets, method: UpdateAsync, summary: Update a budget. }
archiveBudget: { resource: Budgets, method: ArchiveAsync, summary: "Archive a published budget, or delete a draft." }
assignTransactionToBudget: { resource: Budgets, method: AssignTransactionAsync, summary: Count a transaction against a budget. }
getBudgetExpenditures: { resource: Budgets, method: ListExpendituresAsync, iterator: ListAllExpendituresAsync, items: ApiV1BudgetExpenditure, paging: { items: expenditures }, summary: List one page of a budget's spending. }
getBudgetMembers: { resource: Budgets, method: ListMembersAsync, iterator: ListAllMembersAsync, items: ApiV1BudgetMember, paging: { items: members }, summary: List one page of a budget's members. }

listCards: { resource: Cards, method: ListAsync, iterator: ListAllAsync, items: Card, paging: { items: cards }, summary: List one page of cards. }
getCard: { resource: Cards, method: GetAsync, summary: Get one card. }
createCard: { resource: Cards, method: CreateAsync, summary: Issue a card. }
updateCard: { resource: Cards, method: UpdateAsync, summary: Update a card. }
cancelCard: { resource: Cards, method: CancelAsync, summary: Cancel a card for good. }
freezeCard: { resource: Cards, method: FreezeAsync, summary: Freeze a card. }
unfreezeCard: { resource: Cards, method: UnfreezeAsync, summary: Unfreeze a card. }
revealCardPan: { resource: Cards, method: RevealAsync, summary: Get a card's full number and security code. Never log the result. }

listCategories: { resource: Categories, method: ListAsync, iterator: ListAllAsync, items: CategoryData, paging: { items: categories }, summary: List one page of expense categories. }
createCategory: { resource: Categories, method: CreateAsync, summary: Create an expense category. }
editCategory: { resource: Categories, method: UpdateAsync, summary: Update an expense category. }
deleteCategory: { resource: Categories, method: DeleteAsync, summary: Delete an expense category. }

listCredit: { resource: Credit, method: ListAsync, summary: List your credit accounts. }
getCreditAccountStatements: { resource: Credit, method: ListStatementsAsync, iterator: ListAllStatementsAsync, items: AccountStatement, paging: { items: statements }, summary: List one page of a credit account's statements. }

listCustomers: { resource: Customers, method: ListAsync, iterator: ListAllAsync, items: ApiV1ArCustomerResponseData, paging: { items: customers }, summary: List one page of invoicing customers. }
getCustomer: { resource: Customers, method: GetAsync, summary: Get one invoicing customer. }
createCustomer: { resource: Customers, method: CreateAsync, summary: Create an invoicing customer. }
updateCustomer: { resource: Customers, method: UpdateAsync, summary: Update an invoicing customer. }
deleteCustomer: { resource: Customers, method: DeleteAsync, summary: Delete an invoicing customer. }

getEvents: { resource: Events, method: ListAsync, iterator: ListAllAsync, items: ApiEventResponse, paging: { items: events }, summary: List one page of events. }
