deleteRecipient: { resource: Recipients, method: DeleteAsync, summary: Delete a payment recipient. }
uploadRecipientAttachment: { resource: Recipients, method: UploadAttachmentAsync, summary: "Attach a file, such as a tax form, to a recipient." }
listRecipientsAttachments: { resource: Recipients, method: ListAttachmentsAsync, iterator: ListAllAttachmentsAsync, items: RecipientAttachmentWithId, paging: { items: attachments }, summary: List one page of the files attached to recipients. }

listRecipientInvites: { resource: RecipientInvites, method: ListAsync, iterator: ListAllAsync, items: RecipientInviteApiResponse, paging: { items: invites }, summary: List one page of recipient invites. }
