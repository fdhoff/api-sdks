createReceiptUploadUrl: { resource: Receipts, method: CreateUploadUrlAsync, summary: Get a short-lived URL to upload a receipt file to. }
matchReceipt: { resource: Receipts, method: MatchAsync, summary: Start matching an uploaded receipt to a transaction. }

getRecipients: { resource: Recipients, method: ListAsync, iterator: ListAllAsync, items: RecipientInfo, paging: { items: recipients }, summary: List one page of payment recipients. }
getRecipient: { resource: Recipients, method: GetAsync, summary: Get one payment recipient. }
createRecipient: { resource: Recipients, method: CreateAsync, summary: Create a payment recipient. }
