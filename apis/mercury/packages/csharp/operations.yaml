listInvoices: { resource: Invoices, method: ListAsync, iterator: ListAllAsync, items: ApiV1ArInvoicesData, paging: { items: invoices }, summary: List one page of invoices. }
getInvoice: { resource: Invoices, method: GetAsync, summary: Get one invoice. }
createInvoice: { resource: Invoices, method: CreateAsync, summary: Create an invoice. }
updateInvoice: { resource: Invoices, method: UpdateAsync, summary: Update an invoice. }
cancelInvoice: { resource: Invoices, method: CancelAsync, summary: Cancel an invoice. }
getInvoicePdf: { resource: Invoices, method: DownloadPdfAsync, summary: Download an invoice as a PDF. }
listInvoiceAttachments: { resource: Invoices, method: ListAttachmentsAsync, summary: List an invoice's attachments. }
getAttachment: { resource: Invoices, method: GetAttachmentAsync, summary: "Get one invoice attachment, with its download URL." }

listMerchants: { resource: Merchants, method: ListAsync, iterator: ListAllAsync, items: MerchantInfo, paging: { items: data }, summary: List one page of merchants you have paid. }

getOrganization: { resource: Organization, method: GetAsync, summary: Get your organization. }

listProducts: { resource: Products, method: ListAsync, iterator: ListAllAsync, items: ApiV1ArProductResponseData, paging: { items: products }, summary: List one page of invoicing products. }
createProduct: { resource: Products, method: CreateAsync, summary: Create an invoicing product. }

listReceipts: { resource: Receipts, method: ListAsync, iterator: ListAllAsync, items: ApiV1ReceiptResponse, paging: { items: receipts }, summary: List one page of receipts. }
