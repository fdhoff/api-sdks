getStatementPdf: { resource: Statements, method: DownloadPdfAsync, summary: Download an account statement as a PDF. }

listTransactions: { resource: Transactions, method: ListAsync, iterator: ListAllAsync, items: Transaction, paging: { items: transactions }, summary: List one page of transactions across your accounts. }
