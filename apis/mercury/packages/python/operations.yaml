# Public names for every operation, keyed by operationId. Summaries are ours, not upstream's.
# `iterator` adds a method that walks every page and yields `items`. Each page's list and its paging are the ones
# ../../sdk.yaml gives under `iterators`; operations.yaml repeats them until generate.mjs reads them from there.
# `idempotency` lets a money-moving write be retried like a GET when its `idempotencyKey` is set, as in ../../sdk.yaml.
getAccounts: { resource: accounts, method: list, iterator: iter, items: Account, paging: { items: accounts }, summary: List one page of your accounts. }
getAccountCards: { resource: accounts, method: list_cards, summary: List the cards issued on an account. }
getAccountStatements: { resource: accounts, method: list_statements, iterator: iter_statements, items: DepositoryAccountStatement, paging: { items: statements }, summary: List one page of an account's statements. }
listAccountTransactions: { resource: accounts, method: list_transactions, iterator: iter_transactions, items: Transaction, paging: { style: offset, items: transactions, total: total }, summary: List one page of an account's transactions. }
getTransaction: { resource: accounts, method: get_transaction, summary: Get one transaction of an account. }
createTransaction: { resource: accounts, method: send_money, idempotency: { body: idempotencyKey }, summary: Send money from an account to a recipient. }
requestSendMoney: { resource: accounts, method: request_send_money, idempotency: { body: idempotencyKey }, summary: Ask to send money from an account, subject to your approval policy. }
createInternalTransfer: { resource: accounts, method: transfer, idempotency: { body: idempotencyKey }, summary: Move money between two of your accounts. }

getAutoTransferRules: { resource: auto_transfer_rules, method: list, iterator: iter, items: AutoTransferRule, paging: { items: rules }, summary: List one page of automatic transfer rules. }

listBudgets: { resource: budgets, method: list, iterator: iter, items: ApiV1SpendBudgetResponse, paging: { items: budgets }, summary: List one page of budgets. }
getBudget: { resource: budgets, method: get, summary: Get one budget. }
createBudget: { resource: budgets, method: create, summary: Create a budget. }
updateBudget: { resource: budgets, method: update, summary: Update a budget. }
archiveBudget: { resource: budgets, method: archive, summary: Archive a published budget, or delete a draft. }
assignTransactionToBudget: { resource: budgets, method: assign_transaction, summary: Count a transaction against a budget. }
getBudgetExpenditures: { resource: budgets, method: list_expenditures, iterator: iter_expenditures, items: ApiV1BudgetExpenditure, paging: { items: expenditures }, summary: List one page of a budget's spending. }
getBudgetMembers: { resource: budgets, method: list_members, iterator: iter_members, items: ApiV1BudgetMember, paging: { items: members }, summary: List one page of a budget's members. }

listCards: { resource: cards, method: list, iterator: iter, items: Card, paging: { items: cards }, summary: List one page of cards. }
getCard: { resource: cards, method: get, summary: Get one card. }
createCard: { resource: cards, method: create, summary: Issue a card. }
updateCard: { resource: cards, method: update, summary: Update a card. }
cancelCard: { resource: cards, method: cancel, summary: Cancel a card for good. }
freezeCard: { resource: cards, method: freeze, summary: Freeze a card. }
unfreezeCard: { resource: cards, method: unfreeze, summary: Unfreeze a card. }
revealCardPan: { resource: cards, method: reveal, summary: Get a card's full number and security code. Never log the result. }

listCategories: { resource: categories, method: list, iterator: iter, items: CategoryData, paging: { items: categories }, summary: List one page of expense categories. }
createCategory: { resource: categories, method: create, summary: Create an expense category. }
editCategory: { resource: categories, method: update, summary: Update an expense category. }
deleteCategory: { resource: categories, method: delete, summary: Delete an expense category. }

listCredit: { resource: credit, method: list, summary: List your credit accounts. }
getCreditAccountStatements: { resource: credit, method: list_statements, iterator: iter_statements, items: AccountStatement, paging: { items: statements }, summary: List one page of a credit account's statements. }

listCustomers: { resource: customers, method: list, iterator: iter, items: ApiV1ArCustomerResponseData, paging: { items: customers }, summary: List one page of invoicing customers. }
getCustomer: { resource: customers, method: get, summary: Get one invoicing customer. }
createCustomer: { resource: customers, method: create, summary: Create an invoicing customer. }
updateCustomer: { resource: customers, method: update, summary: Update an invoicing customer. }
deleteCustomer: { resource: customers, method: delete, summary: Delete an invoicing customer. }

getEvents: { resource: events, method: list, iterator: iter, items: ApiEventResponse, paging: { items: events }, summary: List one page of events. }
getEvent: { resource: events, method: get, summary: Get one event. }

listInvoices: { resource: invoices, method: list, iterator: iter, items: ApiV1ArInvoicesData, paging: { items: invoices }, summary: List one page of invoices. }
getInvoice: { resource: invoices, method: get, summary: Get one invoice. }
createInvoice: { resource: invoices, method: create, summary: Create an invoice. }
