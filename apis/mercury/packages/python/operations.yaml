listMerchants: { resource: merchants, method: list, iterator: iter, items: MerchantInfo, paging: { items: data }, summary: List one page of merchants you have paid. }

getOrganization: { resource: organization, method: get, summary: Get your organization. }

listProducts: { resource: products, method: list, iterator: iter, items: ApiV1ArProductResponseData, paging: { items: products }, summary: List one page of invoicing products. }
