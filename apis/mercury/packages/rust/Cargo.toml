[package]
name = "mercury-banking"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust client for the Mercury API. Not affiliated with, endorsed by or sponsored by Mercury Technologies, Inc."
license = "Apache-2.0"
repository = "https://github.com/fdhoff/api-sdks"
readme = "README.md"
keywords = ["api", "client", "mercury", "fintech", "payments"]
categories = ["api-bindings", "asynchronous"]
include = ["/src", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[features]
default = ["rustls", "webhooks"]
# TLS through rustls, with the platform's certificate verifier.
rustls = ["reqwest/rustls"]
# TLS through the platform's library: OpenSSL on Linux, Security.framework on macOS, SChannel on Windows.
native-tls = ["reqwest/native-tls"]
# `verify_webhook` for the `Mercury-Signature` header, through aws-lc-rs.
webhooks = ["dep:aws-lc-rs"]

[dependencies]
aws-lc-rs = { version = "1.19", optional = true, default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
flate2 = "1.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
httpdate = "1.0"
log = "0.4"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["http2", "multipart"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.43", features = ["sync", "time"] }
url = "2.5"

[dev-dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt"] }

# The runtime's message signer builds only under a `signing` feature, which this package does not
# need. Its tests still build it, with the dev-dependencies above.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("signing"))'] }

[[example]]
name = "conformance-driver"
path = "conformance/driver.rs"
