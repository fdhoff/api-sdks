cases:
  - name: error-400-from-the-spec
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      prism: { code: 400 }
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: bad_request, status: 400 }

  - name: error-401-from-the-spec
    request:
      operation: getMe
    mock:
      prism: { code: 401 }
    wire:
      - method: GET
        path: /v3/application/users/me
    expect:
      error: { kind: authentication, status: 401 }

  - name: error-403-from-the-spec
    request:
      operation: deleteListing
      params: { listing_id: 1 }
    mock:
      prism: { code: 403 }
    wire:
      - method: DELETE
        path: /v3/application/listings/1
    expect:
      error: { kind: permission, status: 403 }

  - name: error-404-from-the-spec
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      prism: { code: 404 }
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: not_found, status: 404 }

  - name: error-409-from-the-spec
    request:
      operation: deleteListing
      params: { listing_id: 1 }
    mock:
      prism: { code: 409 }
    wire:
      - method: DELETE
        path: /v3/application/listings/1
    expect:
      error: { kind: conflict, status: 409 }

  - name: error-422-is-validation
    request:
      operation: createReceiptShipment
      params: { shop_id: 1, receipt_id: 2 }
      body: { tracking_code: SYNTHETIC-TRACKING-1 }
    mock:
      responses:
        - status: 422
          body: { error: Synthetic validation failure }
    wire:
      - method: POST
        path: /v3/application/shops/1/receipts/2/tracking
    expect:
      error: { kind: validation, status: 422, message: Synthetic validation failure }

  - name: error-message-carries-the-error-text
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      responses:
        - status: 400
          body: { error: Synthetic bad request }
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: bad_request, status: 400, message: Synthetic bad request, raw_body: '{"error":"Synthetic bad request"}' }

  - name: error-unmapped-status
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      responses:
        - status: 418
          body: { error: Synthetic teapot }
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: api, status: 418 }

  - name: error-503-plain-text-stays-typed
    client:
      max_retries: 0
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      responses:
        - status: 503
          headers: { content-type: text/plain }
          body: Service Unavailable
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: server, status: 503, raw_body: Service Unavailable }

  - name: error-malformed-success-body
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      responses:
        - status: 200
          headers: { content-type: application/json }
          body: '{not json'
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: decode, status: 200 }

  - name: error-empty-success-body
    request:
      operation: getShop
      params: { shop_id: 1 }
    mock:
      responses:
        - status: 200
          headers: { content-type: application/json }
    wire:
      - method: GET
        path: /v3/application/shops/1
    expect:
      error: { kind: decode, status: 200 }

  - name: delete-with-no-content-succeeds
    request:
      operation: deleteListing
      params: { listing_id: 1 }
    mock:
      prism: {}
    wire:
      - method: DELETE
        path: /v3/application/listings/1
        headers:
          authorization: 'Bearer {{token}}'
    expect:
      result: null
