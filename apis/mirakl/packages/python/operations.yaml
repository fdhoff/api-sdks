# Public names for every operation, keyed by Mirakl's API code, which each summary repeats so users can match
# Mirakl's docs. Summaries are ours, not upstream's.
# `iterator` adds a method that walks every page and yields `items`. Each page's list and its paging are the ones
# ../../sdk.yaml gives under `iterators`; operations.yaml repeats them until generate.mjs reads them from there.
# Names are those of the TypeScript package in snake_case; `import` is a Python keyword, so it is `import_`.
# `wait` adds a method that polls a job's status operation, for the jobs ../../sdk.yaml lists under `jobs`.
