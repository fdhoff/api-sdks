DR12: { resource: Invoices, method: ListDocumentRequestLines, iterator: IterDocumentRequestLines, items: DR12Response200Data, paging: { items: data }, summary: ListDocumentRequestLines lists one page of a document request's lines (DR12). }
DR73: { resource: Invoices, method: DownloadDocuments, summary: DownloadDocuments downloads accounting documents (DR73). }
DR74: { resource: Invoices, method: UploadDocuments, summary: UploadDocuments uploads accounting documents (DR74). }
DR75: { resource: Invoices, method: ConfirmIssuance, summary: ConfirmIssuance confirms that accounting documents were issued (DR75). }
DR76: { resource: Invoices, method: GenerateDocuments, summary: GenerateDocuments issues accounting documents and generates their files (DR76). }

