RT29: { resource: Returns, method: Cancel, summary: Cancel marks returns as canceled (RT29). }
RT51: { resource: Returns, method: CreateLabels, summary: CreateLabels creates return labels (RT51). }
RT52: { resource: Returns, method: ListLabels, iterator: IterLabels, items: RT52Response200Data, paging: { items: data }, summary: ListLabels lists one page of return labels (RT52). }

M10: { resource: Threads, method: Get, summary: Get gets a message thread (M10). }
M11: { resource: Threads, method: List, iterator: Iter, items: M11Response200Data, paging: { items: data }, summary: List lists one page of message threads (M11). }
M12: { resource: Threads, method: Reply, summary: Reply replies to a message thread (M12). }
M13: { resource: Threads, method: DownloadAttachment, summary: DownloadAttachment downloads a message's attachment (M13). }
M14: { resource: Threads, method: Create, summary: Create starts a message thread with the operator (M14). }

IV01: { resource: Invoices, method: List, iterator: Iter, items: IV01Response200Invoices, paging: { style: offset, items: invoices, total: total_count }, summary: List lists one page of accounting documents (IV01). }
IV02: { resource: Invoices, method: Download, summary: Download downloads an accounting document (IV02). }
SBC11: { resource: Invoices, method: ListBillingCycles, iterator: IterBillingCycles, items: SBC11Response200Data, paging: { items: data }, summary: ListBillingCycles lists one page of the shop's billing cycles (SBC11). }
