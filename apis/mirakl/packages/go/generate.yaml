  shop_sku: ShopSKU
  sku: SKU
  tax_id_number: TaxIDNumber
  thread_id: ThreadID
  to_customer_id: ToCustomerID
  to_shop_id: ToShopID
  tracking_id: TrackingID
  tracking_url: TrackingURL
  trigger_offer_ids: TriggerOfferIDs
  url: URL
  urls: URLs
parameter_name_mappings:
