# How `npm run generate:rust` builds this package. Public method names are in operations.yaml.
generator: rust
output: src
source: src
generated: [apis, models]
resources: resources.rs
runtime: runtime
ignore: [src/apis/configuration.rs]
supporting_files:
  dispatch.mustache: conformance/dispatch.rs
format: [sh, -c, cargo fmt, --]
properties:
  packageName: mirakl_seller
  library: reqwest
# Every field is an Option here, so None already means null or absent.
drop_nullable: true
# A field of several types becomes a serde_json::Value.
drop_unions: true
collapse_single_unions: true
type_mappings:
  integer: i64
  i32: i64
  float: f64
  file: File
  File: File
  binary: File
  DateTime: chrono::DateTime<chrono::FixedOffset>
  date: String
  UUID: String
  URI: String
# The job ID the import operations return, as their wait methods name it.
parameter_name_mappings:
  import: import_id
# Deprecated camelCase duplicates of the `import_id` and `payment_type` fields, which would share their Rust names.
name_mappings:
  importId: deprecated_import_id
  paymentType: deprecated_payment_type
