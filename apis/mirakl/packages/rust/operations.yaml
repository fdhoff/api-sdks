# Public names for every operation, keyed by Mirakl's API code. Summaries are ours, not upstream's, and each ends
# with the code so it can be found in Mirakl's docs.
# `iterator` adds a method that walks every page and yields `items`. Each page's list and its paging are the ones
# ../../sdk.yaml gives under `iterators`; operations.yaml repeats them until generate.mjs reads them from there.
# `wait` names the method that polls a job's status operation, for the jobs ../../sdk.yaml lists.
