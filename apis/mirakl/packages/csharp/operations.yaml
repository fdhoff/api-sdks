# Public names for every operation, keyed by Mirakl's API code, which each summary repeats so users can match
# Mirakl's docs. Summaries are ours, not upstream's.
# `iterator` adds a method that returns every item across all pages as an IAsyncEnumerable of `items`. Each page's list
# and its paging are the ones ../../sdk.yaml gives under `iterators`; operations.yaml repeats them until generate.mjs
# reads them from there.
# `wait` adds a method that polls a job's status operation, for the jobs ../../sdk.yaml lists under `jobs`.
A01: { resource: Shop, method: GetAsync, summary: Get your shop's information (A01). }
