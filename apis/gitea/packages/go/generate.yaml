# How `npm run generate:go` builds this package. Public method names are in operations.yaml.
generator: go
output: gitearest
source: .
generated_prefixes: [model_, api_]
resources: resources.go
runtime: ../internal/runtime
format: [gofmt, -s, -r, 'interface{} -> any', -w]
properties:
  packageName: gitearest
  disallowAdditionalPropertiesIfNotPresent: false
  withGoMod: false
  apiNameSuffix: Resource
  modulePath: github.com/fdhoff/api-sdks/apis/gitea/packages/go
# APIError is this package's error type, so Gitea's error body takes another name.
schema_names:
  APIError: ErrorBody
collapse_single_unions: true
# Every field is a pointer here, so nil already means null or absent.
drop_nullable: true
# A field of several types becomes `any`.
drop_unions: true
type_mappings:
  integer: int64
  number: float64
  file: File
  File: File
  binary: File
  DateTime: Time
# Go spells these initialisms in capitals. Keys are wire names.
name_mappings:
  act_user_id: ActUserID
  archive_download_url: ArchiveDownloadURL
  artifacts_url: ArtifactsURL
  avatar_url: AvatarURL
  aws_access_key_id: AWSAccessKeyID
  aws_secret_access_key: AWSSecretAccessKey
  badge_url: BadgeURL
  browser_download_url: BrowserDownloadURL
  cancel_url: CancelURL
  client_id: ClientID
  clone_url: CloneURL
  column_id: ColumnID
  column_ids: ColumnIDs
  comment_id: CommentID
  commit_id: CommitID
  commit_url: CommitURL
  contents_url: ContentsURL
  creator_id: CreatorID
  diff_url: DiffURL
  download_url: DownloadURL
  external_tracker_url: ExternalTrackerURL
  external_wiki_url: ExternalWikiURL
  git_url: GitURL
  head_commit_id: HeadCommitID
  head_sha: HeadSHA
  html: HTML
  html_url: HTMLURL
  http_git_disabled: HTTPGitDisabled
  id: ID
  ids: IDs
  image_url: ImageURL
  issue_id: IssueID
  issue_url: IssueURL
  jobs_url: JobsURL
  key_id: KeyID
  languages_url: LanguagesURL
  last_commit_sha: LastCommitSHA
  latest_comment_html_url: LatestCommentHTMLURL
  latest_comment_url: LatestCommentURL
  lfs: LFS
  lfs_disabled: LFSDisabled
