repoUpdateTopics: { resource: Repos, method: ReplaceTopics, summary: "ReplaceTopics replaces a repository's topics (repoUpdateTopics)." }
repoAddTopic: { resource: Repos, method: AddTopic, summary: AddTopic adds a topic to a repository (repoAddTopic). }
repoDeleteTopic: { resource: Repos, method: RemoveTopic, summary: RemoveTopic removes a topic from a repository (repoDeleteTopic). }
