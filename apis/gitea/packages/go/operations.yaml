# Public names for every operation, keyed by operationId, which each summary repeats so users can match Gitea's
# API docs. Summaries are ours, not upstream's, and match the Python package's.
# `iterator` adds a method that walks every page and yields `items`. Each page's list is the one ../../sdk.yaml
# gives under `iterators`; operations.yaml repeats it until generate.mjs reads it from there.
# Operations on an organization's or your own resources, where a repository's have the same name, end in
# `ForOrg` and `ForUser`.
# TODO: split this file by resource once generate.mjs reads several operations files for one contract.
repoSearch: { resource: Repos, method: Search, iterator: IterSearch, items: Repository, paging: { items: 'data' }, summary: Search gets one page of the repositories that match a search (repoSearch). }
repoMigrate: { resource: Repos, method: Migrate, summary: Migrate migrates a repository from another service (repoMigrate). }
generateRepo: { resource: Repos, method: Generate, summary: Generate creates a repository from a template repository (generateRepo). }
repoGet: { resource: Repos, method: Get, summary: Get gets a repository (repoGet). }
repoGetByID: { resource: Repos, method: GetByID, summary: GetByID gets a repository by its ID (repoGetByID). }
repoEdit: { resource: Repos, method: Update, summary: "Update changes a repository's settings (repoEdit)." }
repoDelete: { resource: Repos, method: Delete, summary: Delete deletes a repository (repoDelete). }
listForks: { resource: Repos, method: ListForks, iterator: IterForks, items: Repository, paging: { items: '$' }, summary: "ListForks lists one page of a repository's forks (listForks)." }
createFork: { resource: Repos, method: Fork, summary: Fork forks a repository (createFork). }
repoTransfer: { resource: Repos, method: Transfer, summary: Transfer starts transferring a repository to a new owner (repoTransfer). }
acceptRepoTransfer: { resource: Repos, method: AcceptTransfer, summary: AcceptTransfer accepts a repository transfer (acceptRepoTransfer). }
rejectRepoTransfer: { resource: Repos, method: RejectTransfer, summary: RejectTransfer rejects a repository transfer (rejectRepoTransfer). }
repoUpdateAvatar: { resource: Repos, method: UpdateAvatar, summary: "UpdateAvatar sets a repository's avatar (repoUpdateAvatar)." }
repoDeleteAvatar: { resource: Repos, method: DeleteAvatar, summary: "DeleteAvatar removes a repository's avatar (repoDeleteAvatar)." }
repoListActivityFeeds: { resource: Repos, method: ListActivityFeeds, iterator: IterActivityFeeds, items: Activity, paging: { items: '$' }, summary: "ListActivityFeeds lists one page of a repository's activity (repoListActivityFeeds)." }
repoGetArchive: { resource: Repos, method: DownloadArchive, summary: DownloadArchive downloads an archive of a repository at a ref (repoGetArchive). }
repoGetAssignees: { resource: Repos, method: ListAssignees, summary: ListAssignees lists the users that issues and pull requests can be assigned to (repoGetAssignees). }
repoCheckAssignee: { resource: Repos, method: CheckAssignee, summary: CheckAssignee checks whether a user can be assigned issues and pull requests (repoCheckAssignee). }
repoGetReviewers: { resource: Repos, method: ListReviewers, summary: ListReviewers lists the users that can be asked to review pull requests (repoGetReviewers). }
repoListCollaborators: { resource: Repos, method: ListCollaborators, iterator: IterCollaborators, items: User, paging: { items: '$' }, summary: "ListCollaborators lists one page of a repository's collaborators (repoListCollaborators)." }
repoCheckCollaborator: { resource: Repos, method: CheckCollaborator, summary: CheckCollaborator checks whether a user is a collaborator (repoCheckCollaborator). }
repoAddCollaborator: { resource: Repos, method: AddCollaborator, summary: "AddCollaborator adds a collaborator, or changes a collaborator's permission (repoAddCollaborator)." }
repoDeleteCollaborator: { resource: Repos, method: RemoveCollaborator, summary: RemoveCollaborator removes a collaborator (repoDeleteCollaborator). }
repoGetRepoPermissions: { resource: Repos, method: GetPermissions, summary: "GetPermissions gets a user's permissions on a repository (repoGetRepoPermissions)." }
repoListTeams: { resource: Repos, method: ListTeams, summary: ListTeams lists the teams that have access to a repository (repoListTeams). }
repoCheckTeam: { resource: Repos, method: CheckTeam, summary: CheckTeam checks whether a team has access to a repository (repoCheckTeam). }
repoAddTeam: { resource: Repos, method: AddTeam, summary: AddTeam gives a team access to a repository (repoAddTeam). }
repoDeleteTeam: { resource: Repos, method: RemoveTeam, summary: "RemoveTeam removes a team's access to a repository (repoDeleteTeam)." }
repoListStargazers: { resource: Repos, method: ListStargazers, iterator: IterStargazers, items: User, paging: { items: '$' }, summary: ListStargazers lists one page of the users who starred a repository (repoListStargazers). }
repoListSubscribers: { resource: Repos, method: ListWatchers, iterator: IterWatchers, items: User, paging: { items: '$' }, summary: ListWatchers lists one page of the users who watch a repository (repoListSubscribers). }
