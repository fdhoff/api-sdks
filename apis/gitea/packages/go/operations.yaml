repoCreateDeployToken: { resource: Repos, method: CreateDeployToken, summary: "CreateDeployToken creates a deploy token, for Git over HTTPS (repoCreateDeployToken)." }
repoGetIssueConfig: { resource: Repos, method: GetIssueConfig, summary: "GetIssueConfig gets a repository's issue template configuration (repoGetIssueConfig)." }
repoValidateIssueConfig: { resource: Repos, method: ValidateIssueConfig, summary: "ValidateIssueConfig checks a repository's issue template configuration (repoValidateIssueConfig)." }
repoGetIssueTemplates: { resource: Repos, method: ListIssueTemplates, summary: "ListIssueTemplates lists a repository's issue templates (repoGetIssueTemplates)." }
