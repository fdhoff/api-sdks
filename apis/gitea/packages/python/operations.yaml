# Public names for every operation, keyed by operationId, which each summary repeats so users can match Gitea's
# API docs. Summaries are ours, not upstream's.
# `iterator` adds a method that walks every page and yields `items`. Each page's list is the one ../../sdk.yaml
# gives under `iterators`; operations.yaml repeats it until generate.mjs reads it from there.
# Operations on an organization's or your own resources, where a repository's have the same name, end in
# `_for_org` and `_for_user`.
# TODO: split this file by resource once generate.mjs reads several operations files for one contract.
# TODO: iterate repoListTopics and adminUnadoptedList, whose pages hold strings, once the templates take an item
# type that is not a model.
repoSearch: { resource: repos, method: search, iterator: iter_search, items: Repository, paging: { items: 'data' }, summary: Get one page of the repositories that match a search (repoSearch). }
repoMigrate: { resource: repos, method: migrate, summary: Migrate a repository from another service (repoMigrate). }
