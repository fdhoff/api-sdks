# Public names for every operation, keyed by operationId. Summaries are ours, not upstream's, and each ends with the
# operationId so it can be found in Gitea's API docs. Names are the Python package's, in .NET case with an Async suffix.
# `iterator` adds a method that returns every item across all pages as an IAsyncEnumerable of `items`. Each page's list
# is the one ../../sdk.yaml gives under `iterators`; operations.yaml repeats it until generate.mjs reads it from there.
# Operations on an organization's or your own resources, where a repository's have the same name, end in `ForOrg`
# and `ForUser`.
# TODO: split this file by resource once generate.mjs reads several operations files for one contract.
repoSearch: { resource: Repos, method: SearchAsync, iterator: SearchAllAsync, items: Repository, paging: { items: 'data' }, summary: Get one page of the repositories that match a search (repoSearch). }
repoMigrate: { resource: Repos, method: MigrateAsync, summary: Migrate a repository from another service (repoMigrate). }
generateRepo: { resource: Repos, method: GenerateAsync, summary: Create a repository from a template repository (generateRepo). }
