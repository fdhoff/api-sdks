# Settings every language's package shares.

# Every Gitea instance has its own URL, so there are no hosts or environments: the caller always supplies the
# base URL.

# Link header paging: each page's `rel="next"` link gives the next `page` and `limit`, which go into our own next
# request. The link itself is never fetched.
paging: { style: link_header, rel: next, params: [page, limit] }

# The list each iterated operation's pages hold. `$` is a page that is itself the list. A package's
# operations.yaml names the same `items` for each.
iterators:
