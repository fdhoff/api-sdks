[project]
name = "multihost"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "cryptography==50.0.2",
    "mypy==2.4.1",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
mypy_path = "src"
