openapi: 3.0.3
info:
  title: Synthetic multi-host API
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
security:
  - api_key: []
paths:
  /widgets/{widget_id}:
    get:
      operationId: getWidget
      parameters:
        - name: widget_id
          in: path
          required: true
          schema: { type: string }
        - name: verbose
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Site'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
    post:
      operationId: createWidget
      parameters:
        - name: widget_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
  /uploads:
    get:
      operationId: listUploads
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Uploads' }
  /gadgets:
    get:
      operationId: listGadgets
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: start_after
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Site'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gadgets' }
  /imports:
    post:
      operationId: startImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStarted' }
  /imports/{import_id}:
    get:
      operationId: getImport
      parameters:
        - name: import_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStatus' }
  /imports/{import_id}/report:
    get:
      operationId: getImportReport
      parameters:
        - name: import_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema: { type: string, format: binary }
  /parts:
    get:
      operationId: listParts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Part' }
  /bins:
    get:
      operationId: listBins
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: zone
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bins' }
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer }
    Limit:
      name: limit
      in: query
      schema: { type: integer }
    Site:
      name: site
      in: query
      schema: { type: string }
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Widget:
      type: object
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
    WidgetInput:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string }
        name: { type: string }
    Upload:
      type: object
      properties:
        id: { type: string }
        size: { type: integer }
    Uploads:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/Upload' }
    Gadget:
      type: object
      required: [id]
      properties:
        id: { type: string }
    Gadgets:
      type: object
      properties:
        gadgets:
          type: array
          items: { $ref: '#/components/schemas/Gadget' }
        page:
          type: object
          properties:
            next_page: { type: string, nullable: true }
    Part:
      type: object
      required: [id]
      properties:
        id: { type: string }
    Bin:
      type: object
      required: [id]
      properties:
        id: { type: string }
    Bins:
      type: object
      properties:
        total_count: { type: integer }
        bins:
          type: array
          items: { $ref: '#/components/schemas/Bin' }
    ImportInput:
      type: object
      properties:
        name: { type: string }
    ImportStarted:
      type: object
      required: [import_id]
      properties:
        import_id: { type: integer, format: int64 }
    ImportStatus:
      type: object
      required: [import_id, status]
      properties:
        import_id: { type: integer, format: int64 }
        status: { type: string, enum: [WAITING, RUNNING, COMPLETE, FAILED] }
        report_url: { type: string }
